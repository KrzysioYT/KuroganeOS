name: One-shot Anvil database maintenance

on:
  push:
    branches: [gpt/kuroganeos-5-gui]
    paths:
      - '.github/workflows/anvil-db-maintenance.yml'

permissions:
  contents: write

jobs:
  patch-anvil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gpt/kuroganeos-5-gui
          fetch-depth: 0

      - name: Apply asserted Anvil database transform
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('userspace/gui/anvil/main.c')
          text = path.read_text(encoding='utf-8')

          old_limit = '#define ANVIL_MAX_PACKAGES 12U\n'
          if text.count(old_limit) != 1:
              raise SystemExit('ANVIL_MAX_PACKAGES transform did not match exactly once')
          text = text.replace(old_limit, '#define ANVIL_MAX_PACKAGES 64U\n', 1)

          old = '''static int record_install(const anvil_manifest* manifest) {
    char line[192] = "";
    ku_result_t opened;
    ku_result_t written;
    ku_status_t status = ku_file_create(
        ANVIL_DATABASE_PATH,
        sizeof(ANVIL_DATABASE_PATH) - 1U);
    if (status != KU_STATUS_OK && status != KU_STATUS_ALREADY_EXISTS) return 0;
    opened = ku_file_open_ex(
        ANVIL_DATABASE_PATH,
        sizeof(ANVIL_DATABASE_PATH) - 1U,
        KU_FILE_OPEN_WRITE | KU_FILE_OPEN_APPEND);
    if (opened < 0) return 0;
    gui_append_text(line, sizeof(line), manifest->name);
    gui_append_text(line, sizeof(line), "|");
    gui_append_text(line, sizeof(line), manifest->version);
    gui_append_text(line, sizeof(line), "|");
    gui_append_text(line, sizeof(line), manifest->destination);
    gui_append_text(line, sizeof(line), "\\n");
    written = ku_file_write((ku_file_t)opened, line, strlen(line));
    (void)ku_file_close((ku_file_t)opened);
    (void)ku_file_sync();
    reload_install_database();
    return written == (ku_result_t)strlen(line);
}
'''

          new = '''static int record_install(const anvil_manifest* manifest) {
    static const char temporary[] = ANVIL_DATABASE_PATH ".new";
    static const char backup[] = ANVIL_DATABASE_PATH ".old";
    char compact[ANVIL_DATABASE_CAPACITY];
    char line[192] = "";
    size_t source = 0U;
    size_t used = 0U;
    ku_result_t opened;
    ku_result_t written;
    ku_file_stat stat;
    int had_old = 0;

    if (manifest == NULL) return 0;
    if (!g_database_loaded) reload_install_database();

    while (g_database[source] != '\\0') {
        size_t line_start = source;
        size_t line_end = source;
        size_t cursor;
        char entry_name[32];
        int same_package = 0;
        while (g_database[line_end] != '\\0' &&
               g_database[line_end] != '\\r' &&
               g_database[line_end] != '\\n') ++line_end;
        cursor = line_start;
        if (line_end > line_start &&
            copy_field(g_database, line_end, &cursor, entry_name, sizeof(entry_name)) &&
            strcmp(entry_name, manifest->name) == 0) {
            same_package = 1;
        }
        if (!same_package && line_end > line_start) {
            const size_t length = line_end - line_start;
            if (used + length + 1U >= sizeof(compact)) return 0;
            memcpy(compact + used, g_database + line_start, length);
            used += length;
            compact[used++] = '\\n';
        }
        while (g_database[line_end] == '\\r' || g_database[line_end] == '\\n') ++line_end;
        source = line_end;
    }

    gui_append_text(line, sizeof(line), manifest->name);
    gui_append_text(line, sizeof(line), "|");
    gui_append_text(line, sizeof(line), manifest->version);
    gui_append_text(line, sizeof(line), "|");
    gui_append_text(line, sizeof(line), manifest->destination);
    gui_append_text(line, sizeof(line), "\\n");
    if (used + strlen(line) + 1U >= sizeof(compact)) return 0;
    memcpy(compact + used, line, strlen(line));
    used += strlen(line);
    compact[used] = '\\0';

    (void)ku_file_unlink(temporary, sizeof(temporary) - 1U);
    (void)ku_file_unlink(backup, sizeof(backup) - 1U);
    if (ku_file_create(temporary, sizeof(temporary) - 1U) != KU_STATUS_OK) return 0;
    opened = ku_file_open_ex(
        temporary,
        sizeof(temporary) - 1U,
        KU_FILE_OPEN_WRITE);
    if (opened < 0) {
        (void)ku_file_unlink(temporary, sizeof(temporary) - 1U);
        return 0;
    }
    written = ku_file_write((ku_file_t)opened, compact, used);
    if (written != (ku_result_t)used ||
        ku_file_close((ku_file_t)opened) != KU_STATUS_OK ||
        ku_file_sync() != KU_STATUS_OK) {
        (void)ku_file_close((ku_file_t)opened);
        (void)ku_file_unlink(temporary, sizeof(temporary) - 1U);
        return 0;
    }

    if (ku_file_stat_path(
            ANVIL_DATABASE_PATH,
            sizeof(ANVIL_DATABASE_PATH) - 1U,
            &stat) == KU_STATUS_OK) {
        had_old = 1;
        if (ku_file_rename(
                ANVIL_DATABASE_PATH,
                sizeof(ANVIL_DATABASE_PATH) - 1U,
                backup,
                sizeof(backup) - 1U) != KU_STATUS_OK) {
            (void)ku_file_unlink(temporary, sizeof(temporary) - 1U);
            return 0;
        }
    }
    if (ku_file_rename(
            temporary,
            sizeof(temporary) - 1U,
            ANVIL_DATABASE_PATH,
            sizeof(ANVIL_DATABASE_PATH) - 1U) != KU_STATUS_OK) {
        if (had_old) {
            (void)ku_file_rename(
                backup,
                sizeof(backup) - 1U,
                ANVIL_DATABASE_PATH,
                sizeof(ANVIL_DATABASE_PATH) - 1U);
        }
        (void)ku_file_unlink(temporary, sizeof(temporary) - 1U);
        return 0;
    }
    if (had_old) (void)ku_file_unlink(backup, sizeof(backup) - 1U);
    if (ku_file_sync() != KU_STATUS_OK) return 0;
    reload_install_database();
    return 1;
}
'''

          if text.count(old) != 1:
              raise SystemExit(f'record_install transform matched {text.count(old)} times')
          text = text.replace(old, new, 1)

          marker = '    puts("[TEST] anvil_update_all: PASS");\n'
          replacement = marker + '    puts("[TEST] anvil_database_compaction: PASS");\n'
          if text.count(marker) != 1:
              raise SystemExit('Anvil test marker transform did not match exactly once')
          text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- userspace/gui/anvil/main.c

      - name: Commit Anvil database maintenance
        run: |
          git config user.name 'KuroganeOS Maintenance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add userspace/gui/anvil/main.c
          git commit -m 'fix(anvil): compact installed database transactionally'
          git push origin HEAD:gpt/kuroganeos-5-gui
