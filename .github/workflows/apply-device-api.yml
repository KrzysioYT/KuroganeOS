name: Apply 4.0 Ring-3 Device API

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-device-api.yml'
      - '.github/scripts/apply-device-api.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Apply read-only Ring-3 Device API
        run: |
          python3 -m py_compile .github/scripts/apply-device-api.py
          python3 .github/scripts/apply-device-api.py

      - name: Compile release kernel userspace SDK and boot chain
        run: bash ./scripts/build-linux.sh --configuration release --rebuild --no-image

      - name: Commit compiled Ring-3 Device API
        run: |
          rm -f .github/workflows/apply-device-api.yml .github/scripts/apply-device-api.py
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'abi(device): expose read-only generation-safe Device API'
          git push origin HEAD:gpt/road-to-15-consolidation
