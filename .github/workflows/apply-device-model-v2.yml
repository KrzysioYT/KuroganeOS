name: Apply 4.0 Device Model 2.0 foundation

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-device-model-v2.yml'
      - '.github/scripts/apply-device-model-v2.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Apply Device Model 2.0 foundation
        run: |
          python3 -m py_compile .github/scripts/apply-device-model-v2.py
          python3 .github/scripts/apply-device-model-v2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/drivers/core/device_manager.cpp')
          text = p.read_text()
          old = '''    for (size_t index = 0; index < MAXIMUM_DEVICES; ++index) {
        g_devices[index] = {};
    }
'''
          new = '''    for (size_t index = 0; index < MAXIMUM_DEVICES; ++index) {
        const uint32_t generation = g_devices[index].generation;
        g_devices[index] = {};
        g_devices[index].generation = generation;
        g_devices[index].id = static_cast<DeviceId>(index);
        g_devices[index].driver = INVALID_DRIVER_ID;
        g_devices[index].parent = INVALID_DEVICE_ID;
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'device generation-preservation anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))

          todo = Path('TODO-DEFERRED-TESTS.md')
          text = todo.read_text()
          bullet = '- KuroFS v1 metadata core: format/mount on bounded block devices, redundant superblock fallback/disagreement, CRC corruption, geometry overflow/rejection, root inode validation, bitmap metadata reservation, flush/write failure propagation.\n'
          while text.count(bullet) > 1:
              first = text.find(bullet)
              second = text.find(bullet, first + len(bullet))
              text = text[:second] + text[second + len(bullet):]
          todo.write_text(text)
          PY

      - name: Compile release kernel userspace SDK and boot chain
        run: bash ./scripts/build-linux.sh --configuration release --rebuild --no-image

      - name: Commit compiled Device Model 2.0 foundation
        run: |
          rm -f .github/workflows/apply-device-model-v2.yml .github/scripts/apply-device-model-v2.py
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'drivers(core): add Device Model 2.0 handle foundation'
          git push origin HEAD:gpt/road-to-15-consolidation
