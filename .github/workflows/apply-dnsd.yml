name: Apply 3.5 DNS service

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-dnsd.yml'
      - '.github/scripts/apply-dnsd.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Apply DNS service slice
        run: |
          python3 -m py_compile .github/scripts/apply-dnsd.py
          python3 .github/scripts/apply-dnsd.py

      - name: Compile release kernel userspace SDK and boot chain
        run: bash ./scripts/build-linux.sh --configuration release --rebuild --no-image

      - name: Commit compiled DNS service
        run: |
          rm -f .github/workflows/apply-dnsd.yml .github/scripts/apply-dnsd.py
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'userspace(net): add bounded async DNS service'
          git push origin HEAD:gpt/road-to-15-consolidation
