name: Apply 4.0 KuroFS metadata core

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-kurofs-core.yml'
      - '.github/scripts/apply-kurofs-core.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Apply KuroFS metadata core
        run: |
          python3 -m py_compile .github/scripts/apply-kurofs-core.py
          python3 .github/scripts/apply-kurofs-core.py

      - name: Compile release kernel userspace SDK and boot chain
        run: bash ./scripts/build-linux.sh --configuration release --rebuild --no-image

      - name: Commit compiled KuroFS metadata core
        run: |
          rm -f .github/workflows/apply-kurofs-core.yml .github/scripts/apply-kurofs-core.py
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fs(kurofs): add redundant v1 metadata core'
          git push origin HEAD:gpt/road-to-15-consolidation
