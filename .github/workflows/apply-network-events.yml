name: Apply 3.5 network events service

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-network-events.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Integrate network event service
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: anchor missing: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('userspace/system/network-eventd/main.c', '        const ku_status_t status;\n', '        ku_status_t status;\n')
          replace_once('scripts/build-linux.sh', '    "clipboardd|userspace/system/clipboardd/main.c|system/clipd|c"\n', '    "clipboardd|userspace/system/clipboardd/main.c|system/clipd|c"\n    "networkeventd|userspace/system/network-eventd/main.c|system/neteventd|c"\n')
          replace_once('userspace/system/init/main.c', '#define CLIPBOARD_SERVICE_PATH "/system/clipd"\n', '#define CLIPBOARD_SERVICE_PATH "/system/clipd"\n#define NETWORK_EVENT_SERVICE_PATH "/system/neteventd"\n')
          replace_once('userspace/system/init/main.c', 'static uint64_t spawn_clipboard_service(void) {\n    const ku_result_t result = u_spawn(CLIPBOARD_SERVICE_PATH);\n    return result > 0 ? (uint64_t)result : 0U;\n}\n', 'static uint64_t spawn_clipboard_service(void) {\n    const ku_result_t result = u_spawn(CLIPBOARD_SERVICE_PATH);\n    return result > 0 ? (uint64_t)result : 0U;\n}\n\nstatic uint64_t spawn_network_event_service(void) {\n    const ku_result_t result = u_spawn(NETWORK_EVENT_SERVICE_PATH);\n    return result > 0 ? (uint64_t)result : 0U;\n}\n')
          replace_once('userspace/system/init/main.c', '    const uint64_t settings_service_pid = spawn_settings_service();\n', '    const uint64_t network_event_service_pid = spawn_network_event_service();\n    if (network_event_service_pid == 0U) {\n        (void)u_puts("init: cannot spawn /system/neteventd\\n");\n        ku_exit(31);\n    }\n\n    const uint64_t settings_service_pid = spawn_settings_service();\n')
          replace_once('userspace/system/init/main.c', '    service_watch settings_watch = {\n', '    service_watch network_event_watch = {\n        spawn_network_event_service, network_event_service_pid, 0U,\n        (const char*)0\n    };\n    service_watch settings_watch = {\n')
          replace_once('userspace/system/init/main.c', '    if (!supervise_service(&settings_watch)) {\n', '    if (!supervise_service(&network_event_watch)) {\n        (void)u_puts("init: network event service supervision failed\\n");\n        ku_exit(32);\n    }\n\n    if (!supervise_service(&settings_watch)) {\n')
          replace_once('userspace/system/init/main.c', '        if (!supervise_service(&settings_watch)) {\n', '        if (!supervise_service(&network_event_watch)) {\n            (void)u_puts("init: network event service supervision failed\\n");\n            ku_exit(33);\n        }\n        if (!supervise_service(&settings_watch)) {\n')
          replace_once('TODO-DEFERRED-TESTS.md', '- DNS/network-event/TLS userspace integration regressions once those slices land.\n', '- DNS/TLS userspace integration regressions.\n- Network event publisher regressions: broker reconnect, ready/link/address/DNS edge emission, unchanged-state silence, supervisor restart.\n')

      - name: Compile release kernel userspace SDK and boot chain
        run: bash ./scripts/build-linux.sh --configuration release --rebuild --no-image

      - name: Commit compiled network events slice
        run: |
          rm -f .github/workflows/apply-network-events.yml
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'userspace(net): integrate network state-change events'
          git push origin HEAD:gpt/road-to-15-consolidation
