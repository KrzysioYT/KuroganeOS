name: Apply atomic Ring-3 retire fix

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-ring3-retire-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: gpt/road-to-15-consolidation
          fetch-depth: 0

      - name: Apply scheduler/runtime lifecycle fix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'kernel/task/thread.hpp',
              '''Status bind_address_space(\n    memory::kernel_virtual_memory::OwnedAddressSpace* address_space,\n    uintptr_t user_stack = 0U);\nStatus request_yield();\n''',
              '''Status bind_address_space(\n    memory::kernel_virtual_memory::OwnedAddressSpace* address_space,\n    uintptr_t user_stack = 0U);\n// Atomically retires the saved resumable Ring-3 frame for the currently\n// running process thread. Used when SYS_EXIT commits to kernel teardown so a\n// stale user frame can never be selected after its runtime Context is gone.\nStatus retire_current_user_frame();\nStatus request_yield();\n''')

          replace_once(
              'kernel/task/thread.cpp',
              '''uint64_t current_process() {\n    return g_current == kInvalidSlot\n        ? 0U\n        : g_slots[g_current].process_id;\n}\n\nStatus bind_address_space(\n''',
              '''uint64_t current_process() {\n    return g_current == kInvalidSlot\n        ? 0U\n        : g_slots[g_current].process_id;\n}\n\nStatus retire_current_user_frame() {\n    if (!g_initialized) return Status::NotInitialized;\n    const uint64_t flags = save_and_disable_interrupts();\n    if (g_current == kInvalidSlot || !g_run_active) {\n        restore_interrupts(flags);\n        return Status::NotRunning;\n    }\n    Slot& slot = g_slots[g_current];\n    if (slot.process_id == 0U || slot.state != State::Running) {\n        restore_interrupts(flags);\n        return Status::CorruptContext;\n    }\n\n    // Once userspace has committed to SYS_EXIT, no scheduler path may retain\n    // a resumable frame for that address space. The current interrupt frame\n    // is rewritten to a CPL0 trampoline by runtime::finish_from_interrupt;\n    // this clears only the older scheduler-owned resume pointer.\n    slot.interrupt_frame = nullptr;\n    slot.wake_tick = 0U;\n    slot.yield_requested = false;\n    restore_interrupts(flags);\n    return Status::Ok;\n}\n\nStatus bind_address_space(\n''')

          replace_once(
              'kernel/user/runtime_base.inc',
              '''    context.result.exit_code = exit_code;\n    context.active = false;\n    frame.rip = reinterpret_cast<uint64_t>(&x86_64_interrupt_return_to_kernel);\n    frame.cs = arch::x86_64::gdt::KERNEL_CODE_SELECTOR;\n    frame.rsp = context.return_state.kernel_rsp;\n    frame.ss = arch::x86_64::gdt::KERNEL_DATA_SELECTOR;\n    frame.rflags = UINT64_C(0x2);\n    frame.rdi = context.return_state.kernel_rflags;\n''',
              '''    const uint64_t interrupt_flags = save_and_disable_interrupts();\n    const threading::Status retirement_status =\n        threading::retire_current_user_frame();\n    context.result.exit_code = exit_code;\n    context.active = false;\n    frame.rip = reinterpret_cast<uint64_t>(&x86_64_interrupt_return_to_kernel);\n    frame.cs = arch::x86_64::gdt::KERNEL_CODE_SELECTOR;\n    frame.rsp = context.return_state.kernel_rsp;\n    frame.ss = arch::x86_64::gdt::KERNEL_DATA_SELECTOR;\n    frame.rflags = UINT64_C(0x2);\n    frame.rdi = context.return_state.kernel_rflags;\n    restore_interrupts(interrupt_flags);\n    if (retirement_status != threading::Status::Ok) {\n        log::write(\n            log::Level::Error,\n            "RUNTIME",\n            threading::status_message(retirement_status));\n    }\n''')

          replace_once(
              'tests/test_thread.cpp',
              '''uintptr_t stack_b = 0;\n\nvoid append(char value) {\n''',
              '''uintptr_t stack_b = 0;\nbool process_retired = false;\n\nvoid append(char value) {\n''')

          replace_once(
              'tests/test_thread.cpp',
              '''void second(void*) {\n    uint64_t local = 0xB1;\n    stack_b = reinterpret_cast<uintptr_t>(&local);\n    append('B');\n    assert(threading::yield() == threading::Status::Ok);\n    append('D');\n}\n\n} // namespace\n''',
              '''void second(void*) {\n    uint64_t local = 0xB1;\n    stack_b = reinterpret_cast<uintptr_t>(&local);\n    append('B');\n    assert(threading::yield() == threading::Status::Ok);\n    append('D');\n}\n\nvoid process_retire_probe(void*) {\n    assert(threading::current_process() == UINT64_C(42));\n    assert(threading::retire_current_user_frame() == threading::Status::Ok);\n    process_retired = true;\n}\n\n} // namespace\n''')

          replace_once(
              'tests/test_thread.cpp',
              '''    assert(threading::current() == threading::INVALID_THREAD_ID);\n    return 0;\n}\n''',
              '''    assert(threading::current() == threading::INVALID_THREAD_ID);\n    assert(threading::retire_current_user_frame() == threading::Status::NotRunning);\n\n    threading::ThreadId process_id = 0;\n    assert(threading::create_for_process(\n               "retire-probe", process_retire_probe, nullptr, UINT64_C(42), 0U,\n               &process_id) == threading::Status::Ok);\n    threading::RunResult process_result{};\n    assert(threading::run_until_idle(8, &process_result) == threading::Status::Ok);\n    assert(process_result.completed == 1U);\n    assert(process_retired);\n    return 0;\n}\n''')

      - name: Remove one-shot workflow from resulting commit
        run: git rm .github/workflows/apply-ring3-retire-fix.yml

      - name: Commit lifecycle fix
        run: |
          git config user.name 'KuroganeOS Road-to-15'
          git config user.email '59750414+KrzysioYT@users.noreply.github.com'
          git add kernel/task/thread.hpp kernel/task/thread.cpp kernel/user/runtime_base.inc tests/test_thread.cpp
          git diff --cached --check
          git commit -m 'runtime: retire Ring-3 frame before context teardown'
          git push origin HEAD:gpt/road-to-15-consolidation
