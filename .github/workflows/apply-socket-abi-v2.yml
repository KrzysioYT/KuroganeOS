name: Apply 3.5 Socket ABI compile gate

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-socket-abi-v2.yml'
      - '.github/scripts/apply-socket-loopback.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Apply production UDP loopback delivery
        run: |
          python3 -m py_compile .github/scripts/apply-socket-loopback.py
          python3 .github/scripts/apply-socket-loopback.py
          git checkout -- tests/test_socket.cpp

      - name: Apply public socket ABI wiring
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-socket-abi.yml').read_text()
          marker = (
              '      - name: Apply socket ABI wiring\n'
              '        shell: python\n'
              '        run: |\n'
          )
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit('original socket ABI patch step not found')
          start += len(marker)
          lines = workflow[start:].splitlines(True)
          body = []
          for line in lines:
              if line.startswith('      - name:'):
                  break
              if line.strip() and not line.startswith('          '):
                  raise SystemExit(f'unexpected patch indentation: {line!r}')
              body.append(line[10:] if line.startswith('          ') else line)
          source = ''.join(body)
          old = r'    ku_socket_receive_request request = {0};\n'
          new = (
              r'    ku_socket_receive_request request;\n'
              r'    request.bytes_received = 0U;\n'
              r'    request.source.address[0] = 0U;\n'
              r'    request.source.address[1] = 0U;\n'
              r'    request.source.address[2] = 0U;\n'
              r'    request.source.address[3] = 0U;\n'
              r'    request.source.port = 0U;\n'
              r'    request.source.reserved = 0U;\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f'socket receive initializer count={source.count(old)}')
          source = source.replace(old, new, 1)
          exec(compile(source, '<apply-socket-abi>', 'exec'), {'__name__': '__main__'})

      - name: Convert deferred verification to one TODO
        run: |
          git checkout -- scripts/build-linux.sh
          rm -rf userspace/system/socket-probe
          rm -f .github/workflows/qualify-socket-abi.yml
          rm -f .github/scripts/apply-socket-loopback.py
          rm -f .github/workflows/apply-socket-abi-v2.yml
          cat > TODO-DEFERRED-TESTS.md <<'EOF'
          # KuroganeOS — Deferred Test Backlog

          Per the Road to 15 development policy adopted on 2026-08-30, implementation proceeds with compile/build gates while runtime and regression verification is collected here for a later single qualification pass.

          ## 3.5 Connected Userspace
          - UDP socket host regressions: ownership, stale handles, bind collisions, generation reuse, bounded receive queue, BufferTooSmall, ephemeral bind, process cleanup.
          - UDP loopback regressions: self-loopback, cross-process loopback, queue saturation, unused loopback destination, no 127/8 physical-NIC leakage.
          - Ring-3 public UDP ABI roundtrip through syscalls 57..62.
          - Ring-3 socket cleanup after process exit and immediate port rebind.
          - TCP client socket state-machine regressions once the process-owned TCP slice lands.
          - DNS/network-event/TLS userspace integration regressions once those slices land.

          ## Existing deferred qualification
          - Full host regression suite.
          - QEMU/OVMF runtime smoke and integration qualification.
          - Filesystem/network/service regression sweeps.
          - Fatal diagnostic regression sweep.
          - VirtualBox remains an optional external target and is not a release gate.

          ## Final pre-15.0 qualification pass
          - Execute every deferred item above together with milestone-specific tests accumulated here.
          - Do not convert deferred items into PASS markers until they have actually executed successfully.
          EOF

      - name: Compile release kernel userspace SDK and boot chain
        run: bash ./scripts/build-linux.sh --configuration release --rebuild --no-image

      - name: Commit compiled socket ABI slice
        run: |
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'net(abi): expose compiled process-owned UDP sockets'
          git push origin HEAD:gpt/road-to-15-consolidation
