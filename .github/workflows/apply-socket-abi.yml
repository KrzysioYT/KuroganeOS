name: Apply 3.5 Socket ABI

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/apply-socket-abi.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply socket ABI wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: anchor count={count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Public syscall numbers remain append-only.
          replace_once(
              'sdk/include/kurogane/syscall.h',
              '    KU_SYS_IPC_QUERY = 55,\n    KU_SYS_DNS_RESOLVE_A = 56\n};',
              '    KU_SYS_IPC_QUERY = 55,\n'
              '    KU_SYS_DNS_RESOLVE_A = 56,\n'
              '    KU_SYS_SOCKET_CREATE = 57,\n'
              '    KU_SYS_SOCKET_BIND = 58,\n'
              '    KU_SYS_SOCKET_CONNECT = 59,\n'
              '    KU_SYS_SOCKET_SEND = 60,\n'
              '    KU_SYS_SOCKET_RECEIVE = 61,\n'
              '    KU_SYS_SOCKET_CLOSE = 62\n};')

          network = Path('sdk/include/kurogane/network.h')
          text = network.read_text()
          anchor = '#define KU_DNS_FLAG_NONE UINT32_C(0)\n'
          addition = anchor + '''\n#define KU_SOCKET_FLAG_NONE UINT32_C(0)\n#define KU_SOCKET_INVALID UINT64_C(0)\n\ntypedef uint64_t ku_socket_t;\n\nenum ku_socket_type {\n    KU_SOCKET_DATAGRAM = 1,\n    KU_SOCKET_STREAM = 2\n};\n\nenum ku_socket_protocol {\n    KU_SOCKET_PROTOCOL_TCP = 6,\n    KU_SOCKET_PROTOCOL_UDP = 17\n};\n\ntypedef struct ku_ipv4_endpoint {\n    uint8_t address[4];\n    uint16_t port;\n    uint16_t reserved;\n} ku_ipv4_endpoint;\n\ntypedef struct ku_socket_receive_request {\n    uint32_t structure_size;\n    uint32_t flags;\n    ku_socket_t socket;\n    void* buffer;\n    uint64_t buffer_capacity;\n    uint64_t bytes_received;\n    ku_ipv4_endpoint source;\n} ku_socket_receive_request;\n'''
          if text.count(anchor) != 1:
              raise SystemExit('network type anchor mismatch')
          text = text.replace(anchor, addition, 1)
          anchor = 'static inline ku_status_t ku_http_get(ku_http_request* request) {'
          wrappers = '''static inline ku_result_t ku_socket_create(\n    uint32_t type,\n    uint32_t protocol) {\n    return ku_syscall3(KU_SYS_SOCKET_CREATE, type, protocol, KU_SOCKET_FLAG_NONE);\n}\n\nstatic inline ku_status_t ku_socket_bind(\n    ku_socket_t socket,\n    const ku_ipv4_endpoint* endpoint) {\n    if (endpoint == NULL) return KU_STATUS_INVALID_ARGUMENT;\n    return (ku_status_t)ku_syscall3(\n        KU_SYS_SOCKET_BIND, socket, (uint64_t)(uintptr_t)endpoint, sizeof(*endpoint));\n}\n\nstatic inline ku_status_t ku_socket_connect(\n    ku_socket_t socket,\n    const ku_ipv4_endpoint* endpoint) {\n    if (endpoint == NULL) return KU_STATUS_INVALID_ARGUMENT;\n    return (ku_status_t)ku_syscall3(\n        KU_SYS_SOCKET_CONNECT, socket, (uint64_t)(uintptr_t)endpoint, sizeof(*endpoint));\n}\n\nstatic inline ku_result_t ku_socket_send(\n    ku_socket_t socket,\n    const void* buffer,\n    size_t size) {\n    return ku_syscall3(\n        KU_SYS_SOCKET_SEND, socket, (uint64_t)(uintptr_t)buffer, (uint64_t)size);\n}\n\nstatic inline ku_result_t ku_socket_receive(\n    ku_socket_t socket,\n    void* buffer,\n    size_t capacity,\n    ku_ipv4_endpoint* source) {\n    ku_socket_receive_request request = {0};\n    request.structure_size = sizeof(request);\n    request.flags = KU_SOCKET_FLAG_NONE;\n    request.socket = socket;\n    request.buffer = buffer;\n    request.buffer_capacity = capacity;\n    const ku_status_t status = (ku_status_t)ku_syscall3(\n        KU_SYS_SOCKET_RECEIVE,\n        (uint64_t)(uintptr_t)&request,\n        sizeof(request),\n        0U);\n    if (status != KU_STATUS_OK) return status;\n    if (source != NULL) *source = request.source;\n    return (ku_result_t)request.bytes_received;\n}\n\nstatic inline ku_status_t ku_socket_close(ku_socket_t socket) {\n    return (ku_status_t)ku_syscall3(KU_SYS_SOCKET_CLOSE, socket, 0U, 0U);\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('network wrapper anchor mismatch')
          network.write_text(text.replace(anchor, wrappers + anchor, 1))

          # Expose the already-existing production stack to socket.cpp only
          # through bounded service operations, not by leaking g_stack.
          replace_once(
              'kernel/net/service.hpp',
              'Status poll(size_t budget = 8, size_t* processed = nullptr);\n',
              'Status poll(size_t budget = 8, size_t* processed = nullptr);\n'
              'Status socket_send_udp(\n'
              '    const IPv4Address& destination,\n'
              '    uint16_t source_port,\n'
              '    uint16_t destination_port,\n'
              '    const uint8_t* payload,\n'
              '    size_t payload_length);\n'
              'Status socket_take_udp(UdpDatagram* datagram);\n')

          replace_once(
              'kernel/net/service.cpp',
              '''Status poll(size_t budget, size_t* processed) {\n    if (!g_ready) {\n        if (processed != nullptr) *processed = 0U;\n        return Status::NotInitialized;\n    }\n    return net::poll(&g_stack, budget, processed);\n}\n''',
              '''Status poll(size_t budget, size_t* processed) {\n    if (!g_ready) {\n        if (processed != nullptr) *processed = 0U;\n        return Status::NotInitialized;\n    }\n    return net::poll(&g_stack, budget, processed);\n}\n\nStatus socket_send_udp(\n    const IPv4Address& destination,\n    uint16_t source_port,\n    uint16_t destination_port,\n    const uint8_t* payload,\n    size_t payload_length) {\n    if (!g_ready) return Status::NotInitialized;\n    return net::send_udp(\n        &g_stack, destination, source_port, destination_port, payload, payload_length);\n}\n\nStatus socket_take_udp(UdpDatagram* datagram) {\n    if (!g_ready) return Status::NotInitialized;\n    return net::take_udp_datagram(&g_stack, datagram);\n}\n''')

          runtime = Path('kernel/user/runtime.cpp')
          text = runtime.read_text()
          text = text.replace(
              '#include "../net/service.hpp"\n',
              '#include "../net/service.hpp"\n#include "../net/socket.hpp"\n',
              1)
          if '#include "../net/socket.hpp"' not in text:
              raise SystemExit('runtime socket include failed')

          anchor = 'bool copy_user_ipc_name(\n'
          helpers = '''ku_status_t socket_status(net::socket::Status status) {\n    using SocketStatus = net::socket::Status;\n    switch (status) {\n        case SocketStatus::Ok:\n        case SocketStatus::AlreadyInitialized: return KU_STATUS_OK;\n        case SocketStatus::InvalidArgument:\n        case SocketStatus::StaleHandle: return KU_STATUS_INVALID_ARGUMENT;\n        case SocketStatus::NotSupported: return KU_STATUS_NOT_SUPPORTED;\n        case SocketStatus::CapacityReached: return KU_STATUS_OUT_OF_MEMORY;\n        case SocketStatus::AccessDenied: return KU_STATUS_ACCESS_DENIED;\n        case SocketStatus::AddressInUse: return KU_STATUS_ALREADY_EXISTS;\n        case SocketStatus::WouldBlock: return KU_STATUS_WOULD_BLOCK;\n        case SocketStatus::BufferTooSmall:\n        case SocketStatus::PayloadTooLarge: return KU_STATUS_OUT_OF_RANGE;\n        case SocketStatus::NotInitialized:\n        case SocketStatus::NotBound:\n        case SocketStatus::NotConnected: return KU_STATUS_BAD_STATE;\n        case SocketStatus::TransportError: return KU_STATUS_IO_ERROR;\n    }\n    return KU_STATUS_IO_ERROR;\n}\n\nnet::Status socket_backend_send_udp(\n    void*,\n    const net::IPv4Address& destination,\n    uint16_t source_port,\n    uint16_t destination_port,\n    const uint8_t* payload,\n    size_t payload_length) {\n    return net::service::socket_send_udp(\n        destination, source_port, destination_port, payload, payload_length);\n}\n\nnet::Status socket_backend_poll(void*, size_t budget, size_t* processed) {\n    return net::service::poll(budget, processed);\n}\n\nnet::Status socket_backend_take_udp(void*, net::UdpDatagram* datagram) {\n    return net::service::socket_take_udp(datagram);\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('runtime helper anchor mismatch')
          text = text.replace(anchor, helpers + anchor, 1)

          old = '''        (number >= KU_SYS_SHM_CREATE && number <= KU_SYS_SHM_CLOSE) ||\n        (number >= KU_SYS_EVENT_CREATE && number <= KU_SYS_EVENT_CLOSE);'''
          new = '''        (number >= KU_SYS_SHM_CREATE && number <= KU_SYS_SHM_CLOSE) ||\n        (number >= KU_SYS_EVENT_CREATE && number <= KU_SYS_EVENT_CLOSE) ||\n        (number >= KU_SYS_SOCKET_CREATE && number <= KU_SYS_SOCKET_CLOSE);'''
          if text.count(old) != 1:
              raise SystemExit('runtime syscall-range anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''        ipc::shared_memory::release_process(context->pid);\n        ipc::event::release_process(context->pid);'''
          new = '''        ipc::shared_memory::release_process(context->pid);\n        ipc::event::release_process(context->pid);\n        net::socket::release_process(context->pid);'''
          if text.count(old) != 1:
              raise SystemExit('runtime exit cleanup anchor mismatch')
          text = text.replace(old, new, 1)

          anchor = '        case KU_SYS_IPC_QUERY: {'
          cases = '''        case KU_SYS_SOCKET_CREATE: {\n            if (frame.rdx != KU_SOCKET_FLAG_NONE) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            net::socket::Type type;\n            if (frame.rdi == KU_SOCKET_DATAGRAM) {\n                type = net::socket::Type::Datagram;\n            } else if (frame.rdi == KU_SOCKET_STREAM) {\n                type = net::socket::Type::Stream;\n            } else {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            net::socket::Protocol protocol;\n            if (frame.rsi == KU_SOCKET_PROTOCOL_UDP) {\n                protocol = net::socket::Protocol::Udp;\n            } else if (frame.rsi == KU_SOCKET_PROTOCOL_TCP) {\n                protocol = net::socket::Protocol::Tcp;\n            } else {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            net::socket::Handle handle = net::socket::INVALID_HANDLE;\n            const net::socket::Status status = net::socket::create(\n                context->pid, type, protocol, &handle);\n            frame.rax = status == net::socket::Status::Ok\n                ? handle : static_cast<uint64_t>(socket_status(status));\n            return;\n        }\n        case KU_SYS_SOCKET_BIND:\n        case KU_SYS_SOCKET_CONNECT: {\n            if (frame.rdx != sizeof(ku_ipv4_endpoint) ||\n                !validate_user_buffer(*context, frame.rsi, sizeof(ku_ipv4_endpoint))) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            const auto* endpoint = reinterpret_cast<const ku_ipv4_endpoint*>(\n                static_cast<uintptr_t>(frame.rsi));\n            if (endpoint->reserved != 0U || endpoint->port == 0U) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            net::socket::Endpoint target{};\n            for (size_t index = 0U; index < 4U; ++index) {\n                target.address.bytes[index] = endpoint->address[index];\n            }\n            target.port = endpoint->port;\n            const net::socket::Status status = frame.rax == KU_SYS_SOCKET_BIND\n                ? net::socket::bind(\n                    context->pid, static_cast<net::socket::Handle>(frame.rdi), target)\n                : net::socket::connect(\n                    context->pid, static_cast<net::socket::Handle>(frame.rdi), target);\n            frame.rax = static_cast<uint64_t>(socket_status(status));\n            return;\n        }\n        case KU_SYS_SOCKET_SEND: {\n            if (frame.rdx == 0U || frame.rdx > SIZE_MAX ||\n                !validate_user_buffer(*context, frame.rsi, static_cast<size_t>(frame.rdx))) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            const net::socket::Status status = net::socket::send(\n                context->pid,\n                static_cast<net::socket::Handle>(frame.rdi),\n                reinterpret_cast<const void*>(static_cast<uintptr_t>(frame.rsi)),\n                static_cast<size_t>(frame.rdx));\n            frame.rax = status == net::socket::Status::Ok\n                ? frame.rdx : static_cast<uint64_t>(socket_status(status));\n            return;\n        }\n        case KU_SYS_SOCKET_RECEIVE: {\n            if (frame.rsi != sizeof(ku_socket_receive_request) || frame.rdx != 0U ||\n                !validate_user_buffer(\n                    *context, frame.rdi, sizeof(ku_socket_receive_request), true)) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            auto* request = reinterpret_cast<ku_socket_receive_request*>(\n                static_cast<uintptr_t>(frame.rdi));\n            if (request->structure_size != sizeof(*request) ||\n                request->flags != KU_SOCKET_FLAG_NONE ||\n                request->buffer == nullptr || request->buffer_capacity == 0U ||\n                request->buffer_capacity > SIZE_MAX ||\n                !validate_user_buffer(\n                    *context,\n                    static_cast<uint64_t>(reinterpret_cast<uintptr_t>(request->buffer)),\n                    static_cast<size_t>(request->buffer_capacity),\n                    true)) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            size_t received = 0U;\n            net::socket::Endpoint source{};\n            const net::socket::Status status = net::socket::receive(\n                context->pid,\n                static_cast<net::socket::Handle>(request->socket),\n                request->buffer,\n                static_cast<size_t>(request->buffer_capacity),\n                &received,\n                &source);\n            request->bytes_received = received;\n            request->source = {};\n            if (status == net::socket::Status::Ok) {\n                for (size_t index = 0U; index < 4U; ++index) {\n                    request->source.address[index] = source.address.bytes[index];\n                }\n                request->source.port = source.port;\n            }\n            frame.rax = static_cast<uint64_t>(socket_status(status));\n            return;\n        }\n        case KU_SYS_SOCKET_CLOSE: {\n            if (frame.rsi != 0U || frame.rdx != 0U) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            frame.rax = static_cast<uint64_t>(socket_status(net::socket::close(\n                context->pid, static_cast<net::socket::Handle>(frame.rdi))));\n            return;\n        }\n'''
          if text.count(anchor) != 1:
              raise SystemExit('runtime switch anchor mismatch')
          text = text.replace(anchor, cases + anchor, 1)

          anchor = '''    const ipc::event::Status event_initialize_status = ipc::event::initialize();\n    if (event_initialize_status != ipc::event::Status::Ok &&\n        event_initialize_status != ipc::event::Status::AlreadyInitialized) {\n        return Status::InterruptRegistrationFailed;\n    }\n'''
          addition = anchor + '''    const net::socket::Backend socket_backend{\n        nullptr,\n        socket_backend_send_udp,\n        socket_backend_poll,\n        socket_backend_take_udp,\n    };\n    const net::socket::Status socket_initialize_status =\n        net::socket::initialize(socket_backend);\n    if (socket_initialize_status != net::socket::Status::Ok &&\n        socket_initialize_status != net::socket::Status::AlreadyInitialized) {\n        return Status::InterruptRegistrationFailed;\n    }\n'''
          if text.count(anchor) != 1:
              raise SystemExit('runtime init anchor mismatch')
          runtime.write_text(text.replace(anchor, addition, 1))

          # Ship the Ring-3 probe in the normal rootfs; qualification decides
          # when to spawn it, so release init behavior is unchanged.
          replace_once(
              'scripts/build-linux.sh',
              '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n',
              '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
              '    "socketprobe|userspace/system/socket-probe/main.c|system/sockprb|c"\n')

          Path('userspace/system/socket-probe').mkdir(parents=True, exist_ok=True)
          Path('userspace/system/socket-probe/main.c').write_text(r'''#include "../../runtime/user.h"\n\n#include <kurogane/network.h>\n\nstatic void fail(uint32_t code) {\n    (void)u_puts("[TEST] socket_udp_probe: FAIL code=");\n    (void)u_put_u64(code);\n    (void)u_puts("\\n");\n    ku_exit((int32_t)code);\n}\n\n__attribute__((noreturn)) void _start(void) {\n    const ku_ipv4_endpoint endpoint = {{127U, 0U, 0U, 1U}, 45200U, 0U};\n    const char payload[] = "kurogane-udp";\n    uint8_t received[32] = {0};\n    ku_ipv4_endpoint source = {{0U, 0U, 0U, 0U}, 0U, 0U};\n    const ku_result_t created = ku_socket_create(\n        KU_SOCKET_DATAGRAM, KU_SOCKET_PROTOCOL_UDP);\n    if (created <= 0) fail(1U);\n    const ku_socket_t socket = (ku_socket_t)created;\n    if (ku_socket_bind(socket, &endpoint) != KU_STATUS_OK) fail(2U);\n    if (ku_socket_connect(socket, &endpoint) != KU_STATUS_OK) fail(3U);\n    if (ku_socket_send(socket, payload, sizeof(payload) - 1U) !=\n        (ku_result_t)(sizeof(payload) - 1U)) fail(4U);\n\n    ku_result_t count = KU_STATUS_WOULD_BLOCK;\n    for (uint32_t attempt = 0U; attempt < 128U; ++attempt) {\n        count = ku_socket_receive(socket, received, sizeof(received), &source);\n        if (count != KU_STATUS_WOULD_BLOCK) break;\n        (void)ku_yield();\n    }\n    if (count != (ku_result_t)(sizeof(payload) - 1U)) fail(5U);\n    for (size_t index = 0U; index < sizeof(payload) - 1U; ++index) {\n        if (received[index] != (uint8_t)payload[index]) fail(6U);\n    }\n    if (source.port != endpoint.port || source.address[0] != 127U ||\n        source.address[1] != 0U || source.address[2] != 0U || source.address[3] != 1U) {\n        fail(7U);\n    }\n    if (ku_socket_close(socket) != KU_STATUS_OK) fail(8U);\n    ku_exit(0);\n}\n'''.replace('\\n', '\n'))

          Path('.github/workflows/qualify-socket-abi.yml').write_text(r'''name: Qualify 3.5 Public UDP Socket ABI\n\non:\n  push:\n    branches:\n      - gpt/road-to-15-consolidation\n    paths:\n      - 'kernel/net/socket.cpp'\n      - 'kernel/net/socket.hpp'\n      - 'kernel/net/service.cpp'\n      - 'kernel/net/service.hpp'\n      - 'kernel/user/runtime.cpp'\n      - 'sdk/include/kurogane/network.h'\n      - 'sdk/include/kurogane/syscall.h'\n      - 'userspace/system/socket-probe/main.c'\n      - 'scripts/build-linux.sh'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  public-udp-socket:\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n        with:\n          submodules: recursive\n\n      - name: Install build and QEMU dependencies\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y \\\n            build-essential binutils python3 qemu-system-x86 ovmf \\\n            mtools dosfstools gdisk xorriso\n\n      - name: Inject sequential socket lifetime qualification\n        shell: python\n        run: |\n          from pathlib import Path\n          p = Path('userspace/system/init/main.c')\n          text = p.read_text()\n          anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\\\n");\\n'\n          addition = anchor + (\n              '    int32_t socket_exit = -1;\\n'\n              '    const ku_result_t socket_first = u_spawn("/system/sockprb");\\n'\n              '    if (socket_first <= 0 || u_wait((uint64_t)socket_first, &socket_exit) != KU_STATUS_OK || socket_exit != 0) ku_exit(50);\\n'\n              '    (void)u_puts("[TEST] socket_udp_roundtrip: PASS\\\\n");\\n'\n              '    socket_exit = -1;\\n'\n              '    const ku_result_t socket_second = u_spawn("/system/sockprb");\\n'\n              '    if (socket_second <= 0 || u_wait((uint64_t)socket_second, &socket_exit) != KU_STATUS_OK || socket_exit != 0) ku_exit(51);\\n'\n              '    (void)u_puts("[TEST] socket_exit_cleanup: PASS\\\\n");\\n'\n          )\n          if text.count(anchor) != 1:\n              raise SystemExit(f'init anchor count={text.count(anchor)}')\n          p.write_text(text.replace(anchor, addition, 1))\n\n      - name: Run host regressions\n        run: bash ./scripts/run-host-tests.sh\n\n      - name: Build release media\n        run: bash ./scripts/build-media-linux.sh --configuration release --rebuild\n\n      - name: Qualify Ring-3 UDP roundtrip and exit cleanup\n        run: |\n          bash ./scripts/smoke-uefi-iso-qemu.sh \\\n            build/images/KuroganeOS-linux.img \\\n            --disk \\\n            --require-marker '[TEST] socket_udp_roundtrip: PASS' \\\n            --require-marker '[TEST] socket_exit_cleanup: PASS' \\\n            --timeout 90\n'''.replace('\\n', '\n'))

          Path('.github/workflows/apply-socket-abi.yml').unlink()

      - name: Validate full host and release build
        run: |
          bash ./scripts/run-host-tests.sh
          make CONFIG=release kernel

      - name: Commit socket ABI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'net(abi): expose process-owned UDP sockets to Ring-3'
          git push origin HEAD:gpt/road-to-15-consolidation
