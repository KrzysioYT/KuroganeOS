name: Check HTTPS Request and Read Lifecycle

on:
  pull_request:
    branches: [gpt/road-to-15-consolidation]
    paths:
      - 'kernel/net/tls/**'
      - 'tests/test_tls_http_io.cpp'
      - 'tests/host_log_stub.cpp'
      - 'kernel/core/log.hpp'
      - 'scripts/test-tls-http.sh'
      - '.github/workflows/check-tls-http.yml'
  push:
    branches: [gpt/road-to-15-consolidation]
    paths:
      - 'kernel/net/tls/**'
      - 'tests/test_tls_http_io.cpp'
      - 'tests/host_log_stub.cpp'
      - 'kernel/core/log.hpp'
      - 'scripts/test-tls-http.sh'
      - '.github/workflows/check-tls-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Optimized and UBSan production client regression
        run: bash scripts/test-tls-http.sh --ubsan
