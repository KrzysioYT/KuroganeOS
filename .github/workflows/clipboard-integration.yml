# Requalification after fixing clipboard probe self-PID lookup.
name: Qualify clipboard service lifecycle

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/clipboard-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Integrate clipboard daemon and qualification probe
        shell: python
        run: |
          from pathlib import Path

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "settingschangeprobe|userspace/system/settings-change-probe/main.c|system/setchprb|c"\n'
          addition = (
              '    "clipboardd|userspace/system/clipboardd/main.c|system/clipd|c"\n'
              '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('clipboard build anchor changed')
          build.write_text(text.replace(anchor, anchor + addition, 1))

          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          define_anchor = '#define SESSION_SERVICE_PATH "/system/sessiond"\n'
          if text.count(define_anchor) != 1:
              raise SystemExit('clipboard path anchor changed')
          text = text.replace(
              define_anchor,
              define_anchor + '#define CLIPBOARD_SERVICE_PATH "/system/clipd"\n', 1)

          function_anchor = (
              'static uint64_t spawn_session_service(void) {\n'
              '    const ku_result_t result = u_spawn(SESSION_SERVICE_PATH);\n'
              '    return result > 0 ? (uint64_t)result : 0U;\n'
              '}\n'
          )
          function_new = function_anchor + (
              '\nstatic uint64_t spawn_clipboard_service(void) {\n'
              '    const ku_result_t result = u_spawn(CLIPBOARD_SERVICE_PATH);\n'
              '    return result > 0 ? (uint64_t)result : 0U;\n'
              '}\n'
          )
          if text.count(function_anchor) != 1:
              raise SystemExit('clipboard function anchor changed')
          text = text.replace(function_anchor, function_new, 1)

          start_anchor = '    (void)u_puts("[TEST] session_service_spawn: PASS\\n");\n'
          start_new = start_anchor + (
              '\n    const uint64_t clipboard_service_pid = spawn_clipboard_service();\n'
              '    if (clipboard_service_pid == 0U) {\n'
              '        (void)u_puts("init: cannot spawn /system/clipd\\n");\n'
              '        (void)u_puts("[TEST] clipboard_service_spawn: FAIL\\n");\n'
              '        ku_exit(27);\n'
              '    }\n'
              '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n'
              '    const ku_result_t clipboard_probe_pid = u_spawn("/system/clipprb");\n'
              '    if (clipboard_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] clipboard_service_roundtrip: FAIL\\n");\n'
              '        ku_exit(28);\n'
              '    }\n'
          )
          if text.count(start_anchor) != 1:
              raise SystemExit('clipboard startup anchor changed')
          text = text.replace(start_anchor, start_new, 1)

          live_anchor = '    (void)u_puts("[TEST] session_service_liveness: PASS\\n");\n\n'
          live_new = live_anchor + (
              '    service_status = 0;\n'
              '    const ku_status_t clipboard_early = ku_wait(clipboard_service_pid, &service_status);\n'
              '    if (clipboard_early != KU_STATUS_WOULD_BLOCK) {\n'
              '        (void)u_puts("[TEST] clipboard_service_liveness: FAIL\\n");\n'
              '        ku_exit(29);\n'
              '    }\n'
              '    (void)u_puts("[TEST] clipboard_service_liveness: PASS\\n");\n\n'
          )
          if text.count(live_anchor) != 1:
              raise SystemExit('clipboard liveness anchor changed')
          text = text.replace(live_anchor, live_new, 1)

          loop_anchor = (
              '        status = 0;\n'
              '        const ku_status_t wait_status = ku_wait(session_pid, &status);'
          )
          loop_new = (
              '        service_status = 0;\n'
              '        const ku_status_t clipboard_wait = ku_wait(clipboard_service_pid, &service_status);\n'
              '        if (clipboard_wait == KU_STATUS_OK || clipboard_wait == KU_STATUS_NOT_FOUND) {\n'
              '            (void)u_puts("init: clipboard service terminated\\n");\n'
              '            (void)u_puts("[TEST] clipboard_service_liveness: FAIL\\n");\n'
              '            ku_exit(30);\n'
              '        }\n'
              '        if (clipboard_wait != KU_STATUS_WOULD_BLOCK) {\n'
              '            (void)u_puts("init: clipboard service supervision failed\\n");\n'
              '            ku_exit(31);\n'
              '        }\n\n'
              + loop_anchor
          )
          if text.count(loop_anchor) != 1:
              raise SystemExit(f'clipboard loop anchor count={text.count(loop_anchor)}')
          init.write_text(text.replace(loop_anchor, loop_new, 1))

      - name: Validate candidate
        run: |
          git diff --check
          grep -F 'system/clipd' scripts/build-linux.sh
          grep -F 'system/clipprb' scripts/build-linux.sh
          grep -F '[TEST] clipboard_service_liveness: PASS' userspace/system/init/main.c
          [[ ${#clipd} -le 8 ]]
          [[ ${#clipprb} -le 8 ]]

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require real clipboard lifecycle
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] clipboard_service_roundtrip: PASS' \
            --timeout 180

      - name: Remove qualification-only probe launch
        shell: python
        run: |
          from pathlib import Path
          path = Path('userspace/system/init/main.c')
          text = path.read_text()
          probe = (
              '    const ku_result_t clipboard_probe_pid = u_spawn("/system/clipprb");\n'
              '    if (clipboard_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] clipboard_service_roundtrip: FAIL\\n");\n'
              '        ku_exit(28);\n'
              '    }\n'
          )
          if text.count(probe) != 1:
              raise SystemExit('clipboard qualification probe stanza changed')
          path.write_text(text.replace(probe, '', 1))

      - name: Land qualified clipboard integration
        run: |
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/clipboard-integration.yml
          git add scripts/build-linux.sh userspace/system/init/main.c
          git commit -m 'service(clipboard): integrate daemon lifecycle'
          git push origin HEAD:gpt/road-to-15-consolidation
