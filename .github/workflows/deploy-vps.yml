name: Deploy KuroganeOS VPS backend

on:
  workflow_dispatch:
    inputs:
      media_run_id:
        description: Optional successful UEFI qualification run ID (latest successful branch run by default)
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: 147.79.62.37
      VPS_USER: root
      KUROGANE_VPS_SSH_KEY: ${{ secrets.KUROGANE_VPS_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4

      - name: Require deployment key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KUROGANE_VPS_SSH_KEY}" ]]; then
            echo "Missing repository secret KUROGANE_VPS_SSH_KEY" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KUROGANE_VPS_SSH_KEY" > ~/.ssh/kurogane_vps
          chmod 600 ~/.ssh/kurogane_vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Bootstrap or update backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsafe branch name: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          ssh -i ~/.ssh/kurogane_vps \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "KUROGANE_BRANCH='$GITHUB_REF_NAME' bash -s" \
            < deploy/vps/bootstrap.sh

      - name: Resolve qualified system media
        id: media
        shell: bash
        env:
          REQUESTED_RUN_ID: ${{ inputs.media_run_id }}
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow virtualbox-iso.yml \
              --branch "$GITHUB_REF_NAME" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful UEFI qualification run found for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          artifact_name="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | endswith("-uefi-media")))][0].name')"
          if [[ -z "$artifact_name" || "$artifact_name" == "null" ]]; then
            echo "Run $run_id has no non-expired qualified media artifact" >&2
            exit 1
          fi
          install -d "$RUNNER_TEMP/kuroganeos-media"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$RUNNER_TEMP/kuroganeos-media"
          python3 deploy/vps/scripts/build-release-manifest.py \
            "$RUNNER_TEMP/kuroganeos-media" \
            "$RUNNER_TEMP/kuroganeos-media/latest.json"
          echo "directory=$RUNNER_TEMP/kuroganeos-media" >> "$GITHUB_OUTPUT"
          echo "Qualified media resolved from run $run_id ($artifact_name)"

      - name: Publish ISO and IMG to downloads host
        shell: bash
        env:
          MEDIA_DIRECTORY: ${{ steps.media.outputs.directory }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Unsafe workflow run ID" >&2
            exit 1
          fi
          incoming="/opt/kuroganeos/incoming/$GITHUB_RUN_ID"
          ssh -i ~/.ssh/kurogane_vps -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "install -d -m 0755 '$incoming'"
          scp -i ~/.ssh/kurogane_vps -o BatchMode=yes \
            "$MEDIA_DIRECTORY"/* "$VPS_USER@$VPS_HOST:$incoming/"
          ssh -i ~/.ssh/kurogane_vps -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -e; install -d -m 0755 /opt/kuroganeos/downloads; install -m 0644 '$incoming'/* /opt/kuroganeos/downloads/; rm -rf -- '$incoming'"

      - name: Verify public services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 https://kuroganeos.dev/healthz \
              && curl -fsS --max-time 10 https://docs.kuroganeos.dev/healthz \
              && curl -fsS --max-time 10 https://repo.kuroganeos.dev/healthz \
              && curl -fsS --max-time 10 https://downloads.kuroganeos.dev/healthz \
              && curl -fsS --max-time 10 https://repo.kuroganeos.dev/index.kuro | grep -q '^KIDX1' \
              && curl -fsS --max-time 10 https://downloads.kuroganeos.dev/latest.json | grep -q '"schema": 1'; then
              echo "KuroganeOS VPS backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Backend health gate failed" >&2
          exit 1
