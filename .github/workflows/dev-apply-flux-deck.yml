name: Dev Apply Flux Deck

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - .github/workflows/dev-apply-flux-deck.yml
      - scripts/dev-apply-flux-deck.py
      - scripts/dev-apply-flux-deck-v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, kurogane, kvm]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/road-to-15-consolidation
          fetch-depth: 0

      - name: Verify branch and KVM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt/road-to-15-consolidation
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/gpt/road-to-15-consolidation)"
          command -v qemu-system-x86_64
          test -r /dev/kvm && test -w /dev/kvm

      - name: Apply guarded Flux Deck migration
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/dev-apply-flux-deck-v2.py
          bash -n ./scripts/smoke-uefi-iso-qemu.sh

      - name: Run full host regressions
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/run-host-tests.sh

      - name: Build complete release media
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-media-linux.sh --configuration release --rebuild

      - name: Prove mouse-only Flux Deck app launch
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/smoke-uefi-iso-qemu.sh build/images/KuroganeOS-linux.img \
            --disk --timeout 240 \
            --click-after-marker '[TEST] red_flux_login_surface: PASS' 540 422 \
            --click-after-marker '[TEST] red_flux_home_surface: PASS' 574 265 \
            --require-marker '[TEST] red_flux_login_to_desktop: PASS' \
            --require-marker '[TEST] red_flux_tile_launcher: PASS' \
            --require-marker '[TEST] desktop_files_real_vfs: PASS'

      - name: Commit and publish Flux Deck
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sdk/include/kurogane/ui.h \
            sdk/include/kurogane/libui.h \
            sdk/src/libui.c \
            kernel/ui/ui.hpp \
            kernel/ui/ui.cpp \
            kernel/ui/window_manager.cpp \
            kernel/user/runtime_base.inc \
            userspace/gui/launcher/main.c \
            tests/test_sdk_abi.cpp \
            tests/test_libui_pointer.c \
            tests/test_mouse_first_apps.py \
            scripts/smoke-uefi-iso-qemu.sh
          git diff --cached --quiet && { echo "guard produced no Flux Deck production changes"; exit 1; }
          git commit -m "feat(gui): introduce Flux Deck tile launcher"
          git reset --hard HEAD
          git fetch origin gpt/road-to-15-consolidation
          git rebase origin/gpt/road-to-15-consolidation
          git push origin HEAD:gpt/road-to-15-consolidation
