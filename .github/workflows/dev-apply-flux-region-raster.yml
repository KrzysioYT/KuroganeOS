name: Dev Apply 3.6 Flux Region Raster

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - 'scripts/dev-apply-flux-region-raster.py'
      - '.github/workflows/dev-apply-flux-region-raster.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-flux-region-raster:
    runs-on: [self-hosted, kurogane, kvm]
    timeout-minutes: 30
    steps:
      - name: Checkout region raster patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply production partial-composition patch
        run: python3 scripts/dev-apply-flux-region-raster.py

      - name: Validate region raster and regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'MAX_COMPOSITOR_DAMAGE_REGIONS' kernel/drivers/framebuffer.hpp
          grep -F 'set_damage_regions(' kernel/drivers/framebuffer.cpp
          grep -F 'partial_raster = graphics::set_damage_regions' kernel/ui/window_manager.cpp
          grep -F 'framebuffer compositor damage raster tests passed' tests/test_framebuffer_damage.cpp
          bash ./scripts/run-host-tests.sh
          make CONFIG=release kernel

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KuroganeOS CI'
          git config user.email '59750414+KrzysioYT@users.noreply.github.com'
          git add \
            kernel/drivers/framebuffer.hpp \
            kernel/drivers/framebuffer.cpp \
            kernel/ui/window_manager.cpp \
            tests/test_framebuffer_damage.cpp \
            scripts/run-host-tests.sh
          git diff --cached --check
          git diff --cached --quiet && { echo 'no source changes to commit' >&2; exit 1; }
          git commit -m 'feat(3.6): rasterize Flux damage regions only'
          git push origin "HEAD:${GITHUB_REF_NAME}"
