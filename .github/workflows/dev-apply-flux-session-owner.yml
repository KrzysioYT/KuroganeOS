name: Dev Apply 3.6 Flux Session Ownership

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - 'scripts/dev-apply-flux-session-owner.py'
      - '.github/workflows/dev-apply-flux-session-owner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-flux-session-owner:
    runs-on: [self-hosted, kurogane, kvm]
    timeout-minutes: 35
    steps:
      - name: Checkout patch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply deterministic production patch
        shell: bash
        run: |
          set -euo pipefail
          # The patcher was validated together with the runtime-workflow edit in
          # run 33423283603, but the self-hosted Actions token cannot push a
          # workflow file. Recreate only that guarded baseline locally, apply the
          # exact same patch, then restore the already-updated workflow from this
          # source commit. The production diff remains identical to the validated
          # source slice while workflow configuration is owned by GitHub directly.
          git show cfd7ab76d6b87df103145bc21db60345d5287a4e:.github/workflows/qualify-flux-runtime.yml \
            > .github/workflows/qualify-flux-runtime.yml
          python3 scripts/dev-apply-flux-session-owner.py
          git checkout "$GITHUB_SHA" -- .github/workflows/qualify-flux-runtime.yml

      - name: Validate ownership, host regressions and release kernel
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '[TEST] flux_session_owner: PASS' kernel/main.cpp
          ! grep -F 'desktop auto-launch failed:' kernel/main.cpp
          ! grep -F 'kurogane_start_desktop_session' kernel/user/console.cpp
          grep -F 'cannot start Flux session while another application owns the host' kernel/apps/desktop_session.cpp
          grep -F -- '--send-key-after-marker' scripts/smoke-uefi-iso-qemu.sh
          grep -F -- "--send-key-after-marker '[TEST] live_login_profile: PASS' ret" .github/workflows/qualify-flux-runtime.yml
          bash ./scripts/run-host-tests.sh
          make CONFIG=release kernel

      - name: Commit production source and qualification harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KuroganeOS CI'
          git config user.email '59750414+KrzysioYT@users.noreply.github.com'
          git add \
            kernel/main.cpp \
            kernel/apps/desktop_session.cpp \
            kernel/user/console.cpp \
            scripts/smoke-uefi-iso-qemu.sh
          git diff --cached --check
          git diff --cached --quiet && { echo 'no source changes to commit' >&2; exit 1; }
          git commit -m 'fix(3.6): unify Flux desktop session ownership'
          git push origin "HEAD:${GITHUB_REF_NAME}"
