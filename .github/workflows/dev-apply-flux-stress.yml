name: Dev Apply 3.6 Flux Stress

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - 'scripts/dev-apply-flux-stress.py'
      - '.github/workflows/dev-apply-flux-stress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-flux-stress:
    runs-on: [self-hosted, kurogane, kvm]
    timeout-minutes: 35
    steps:
      - name: Checkout stress patch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply production stress patch
        run: python3 scripts/dev-apply-flux-stress.py

      - name: Validate bounded churn and regressions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'Status resource_snapshot(ResourceSnapshot* out_snapshot);' kernel/ui/window_manager.hpp
          grep -F 'for (size_t iteration = 0U; iteration < 256U; ++iteration)' tests/test_window_manager.cpp
          grep -F '#define CHURN_ITERATIONS 64U' userspace/system/flux-surface-probe/main.c
          bash ./scripts/run-host-tests.sh
          make CONFIG=release kernel

      - name: Commit stress production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KuroganeOS CI'
          git config user.email '59750414+KrzysioYT@users.noreply.github.com'
          git add \
            kernel/ui/window_manager.cpp \
            kernel/ui/window_manager.hpp \
            tests/test_window_manager.cpp \
            userspace/system/flux-surface-probe/main.c
          git diff --cached --check
          git diff --cached --quiet && { echo 'no stress changes to commit' >&2; exit 1; }
          git commit -m 'test(3.6): stress Flux window and surface lifecycle'
          git push origin "HEAD:${GITHUB_REF_NAME}"
