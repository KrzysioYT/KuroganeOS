name: Apply live network link state

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/dev-apply-network-link-state.yml'
      - 'scripts/dev-apply-network-link-state.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply guarded live link-state patch
        run: |
          python3 scripts/dev-apply-network-link-state.py
          git diff --check

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 \
            mtools dosfstools gdisk xorriso

      - name: Run full host regression suite
        run: bash ./scripts/run-host-tests.sh

      - name: Build clean release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Exclude one-shot staging machinery
        run: |
          git checkout "$GITHUB_SHA" -- \
            scripts/dev-apply-network-link-state.py \
            .github/workflows/dev-apply-network-link-state.yml
          git diff --check

      - name: Commit qualified source patch
        run: |
          git config user.name 'KuroganeOS GPT Developer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'no live link-state source changes'; exit 1; }
          git commit -m 'feat(net): expose live physical link state'
          git push origin HEAD:gpt/road-to-15-consolidation
