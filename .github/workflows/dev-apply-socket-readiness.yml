name: Apply guarded socket readiness patch

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/dev-apply-socket-readiness.yml'
      - 'scripts/dev-apply-socket-readiness.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply guarded source patch
        run: |
          python3 scripts/dev-apply-socket-readiness.py
          git diff --check

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3

      - name: Run host regression suite
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/run-host-tests.sh

      - name: Remove one-shot development machinery
        run: |
          rm -f scripts/dev-apply-socket-readiness.py
          rm -f .github/workflows/dev-apply-socket-readiness.yml
          git diff --check

      - name: Commit qualified source patch
        run: |
          git config user.name 'KuroganeOS GPT Developer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'no source changes'; exit 1; }
          git commit -m 'feat(socket): add blocking readiness wake path'
          git push origin HEAD:gpt/road-to-15-consolidation
