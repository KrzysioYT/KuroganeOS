name: 4.0 Qualify Forge Control

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - .github/workflows/dev-qualify-control-center-audio.yml
      - kernel/ui/ui.cpp
      - kernel/ui/ui.hpp
      - kernel/ui/window_manager.cpp
      - kernel/user/runtime_base.inc
      - sdk/include/kurogane/design.h
      - sdk/include/kurogane/libui.h
      - sdk/include/kurogane/ui.h
      - sdk/src/libui.c
      - scripts/build-linux.sh
      - scripts/build-media-linux.sh
      - scripts/smoke-uefi-iso-qemu.sh
      - userspace/gui/launcher/main.c
      - userspace/gui/performance/main.c

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, kurogane, kvm]
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt/road-to-15-consolidation
          fetch-depth: 0

      - name: Verify branch and KVM
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt/road-to-15-consolidation
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/gpt/road-to-15-consolidation)"
          command -v qemu-system-x86_64
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run full host regressions
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/run-host-tests.sh

      - name: Build release media
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-media-linux.sh --configuration release --rebuild

      - name: Prove real Forge Control navigation and AC97 action
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/smoke-uefi-iso-qemu.sh build/images/KuroganeOS-linux.img \
            --disk --audio ac97 --timeout 240 \
            --click-after-marker '[TEST] red_flux_login_surface: PASS' 540 422 \
            --click-after-marker '[TEST] red_flux_home_surface: PASS' 770 300 \
            --click-after-marker '[TEST] flux_control_center_audio_status: PASS' 850 260 \
            --click-after-marker '[TEST] forge_control_audio_surface: PASS' 523 510 \
            --require-marker '[TEST] red_flux_login_to_desktop: PASS' \
            --require-marker '[TEST] flux_control_center_live: PASS' \
            --require-marker '[TEST] flux_control_center_audio_status: PASS' \
            --require-marker '[TEST] forge_control_audio_surface: PASS' \
            --require-marker '[TEST] flux_control_center_audio_action: PASS'
