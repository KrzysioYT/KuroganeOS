name: Installer credential compatibility

on:
  pull_request:
    branches: [ main, dev/road-to-15 ]
    paths:
      - 'common/dev_credential.h'
      - 'userspace/gui/login/main.c'
      - 'tests/test_dev_credential.c'
      - '.github/workflows/installer-credential.yml'
  push:
    branches: [ main ]
    paths:
      - 'common/dev_credential.h'
      - 'userspace/gui/login/main.c'
      - 'tests/test_dev_credential.c'
      - '.github/workflows/installer-credential.yml'
  workflow_dispatch:

jobs:
  credential-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DEV credential regression
        run: |
          mkdir -p build/tests/dev-credential
          gcc -std=c11 -O2 -Wall -Wextra -Wpedantic \
            tests/test_dev_credential.c \
            -o build/tests/dev-credential/test_dev_credential

      - name: Run good/bad password regression
        run: build/tests/dev-credential/test_dev_credential
