name: Qualify 3.5 Audio + App Registry KVM

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-3.5-audio-app-kvm.yml'
      - 'kernel/storage/**'
      - 'kernel/drivers/audio/**'
      - 'kernel/drivers/builtin_drivers.cpp'
      - 'kernel/user/runtime.cpp'
      - 'kernel/user/runtime_base.inc'
      - 'kernel/fs/**'
      - 'kernel/install/**'
      - 'sdk/include/kurogane/audio.h'
      - 'sdk/include/kurogane/audio_service.h'
      - 'sdk/include/kurogane/application.h'
      - 'sdk/include/kurogane/filesystem.h'
      - 'sdk/include/kurogane/service.h'
      - 'userspace/system/audiod/**'
      - 'userspace/system/audio-service-probe/**'
      - 'userspace/system/audio-exit-client/**'
      - 'userspace/system/audio-owner-exit/**'
      - 'userspace/system/app-registryd/**'
      - 'userspace/system/app-registry-probe/**'
      - 'userspace/system/init/main.c'
      - 'scripts/build-install-package.py'
      - 'scripts/build-linux.sh'
      - 'scripts/build-media-linux.sh'
      - 'tests/test_install_package.cpp'
      - 'tests/test_install_package_builder.py'
      - 'tests/test_install_package_paths.py'
      - 'rootfs/apps/appman/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-app-kvm:
    runs-on: [self-hosted, kurogane, kvm]
    timeout-minutes: 25
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify Kurogane KVM host
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          bash ./scripts/setup-linux.sh

      - name: Inject Audio and App Registry Ring-3 probes
        shell: python3 {0}
        run: |
          from pathlib import Path

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          addition = (
              '    "audioserviceprobe|userspace/system/audio-service-probe/main.c|system/audprb|c"\n'
              '    "audioexitclient|userspace/system/audio-exit-client/main.c|system/audxcli|c"\n'
              '    "audioownerexit|userspace/system/audio-owner-exit/main.c|system/audownx|c"\n'
              '    "appregistryprobe|userspace/system/app-registry-probe/main.c|system/apprgprb|c"\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'build anchor count={text.count(anchor)}')
          build.write_text(text.replace(anchor, anchor + addition, 1))

          manifests = Path('rootfs/apps/appman')
          manifests.mkdir(parents=True, exist_ok=True)
          fixtures = {
              'probe.mnf': 'format=1\nid=org.kurogane.probe\nname=Registry Probe\nexec=/apps/hello\nflags=4\n',
              'dup1.mnf': 'format=1\nid=org.kurogane.dupe\nname=Duplicate A\nexec=/apps/hello\nflags=4\n',
              'dup2.mnf': 'format=1\nid=org.kurogane.dupe\nname=Duplicate B\nexec=/apps/hello\nflags=4\n',
              'bad.mnf': 'format=2\nid=org.kurogane.bad\nname=Malformed\nexec=/apps/hello\nflags=4\n',
              'miss.mnf': 'format=1\nid=org.kurogane.missing\nname=Missing Executable\nexec=/apps/doesnotexist\nflags=4\n',
              'long.mnf': 'format=1\nid=org.kurogane.toolong\nname=' + ('X' * 48) + '\nexec=/apps/hello\nflags=4\n',
          }
          for name, contents in fixtures.items():
              (manifests / name).write_text(contents)

          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n'
          spawn = anchor + (
              '\n'
              '    const ku_result_t app_registry_probe_pid = u_spawn("/system/apprgprb");\n'
              '    if (app_registry_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] app_registry: FAIL code=90\\n");\n'
              '        ku_exit(45);\n'
              '    }\n'
              '\n'
              '    const ku_result_t audio_probe_pid = u_spawn("/system/audprb");\n'
              '    if (audio_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] audio_service_roundtrip: FAIL code=90\\n");\n'
              '        ku_exit(43);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'init anchor count={text.count(anchor)}')
          init.write_text(text.replace(anchor, spawn, 1))

      - name: Validate qualification injection
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'system/audprb' scripts/build-linux.sh
          grep -F 'system/audxcli' scripts/build-linux.sh
          grep -F 'system/audownx' scripts/build-linux.sh
          grep -F 'system/apprgprb' scripts/build-linux.sh
          grep -F '[TEST] audio_service_roundtrip: PASS' userspace/system/audio-service-probe/main.c
          grep -F '[TEST] audio_exit_cleanup: PASS' userspace/system/audio-service-probe/main.c
          grep -F '[TEST] app_registry: PASS' userspace/system/app-registry-probe/main.c

      - name: Run full host regression suite
        run: bash ./scripts/run-host-tests.sh

      - name: Build full release media
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img
          test -s build/install.pkg

      - name: Require real Audio and App Registry Ring-3 runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          serial="$tmp/serial.log"
          qemu_log="$tmp/qemu.log"
          vars="$tmp/OVMF_VARS.fd"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]] && kill -0 "$pid" >/dev/null 2>&1; then
              kill "$pid" >/dev/null 2>&1 || true
              wait "$pid" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$tmp"
          }
          trap cleanup EXIT INT TERM

          code=""
          vars_template=""
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            if [[ -f "$candidate" ]]; then code="$candidate"; break; fi
          done
          [[ -n "$code" ]] || { echo 'OVMF CODE not found' >&2; exit 1; }
          if [[ "$code" == */OVMF_CODE_4M.fd ]]; then
            vars_template="${code%/OVMF_CODE_4M.fd}/OVMF_VARS_4M.fd"
          else
            vars_template="${code%/OVMF_CODE.fd}/OVMF_VARS.fd"
          fi
          [[ -f "$vars_template" ]] || { echo 'OVMF VARS not found' >&2; exit 1; }
          cp "$vars_template" "$vars"

          qemu-system-x86_64 \
            -machine q35,accel=kvm \
            -cpu host \
            -m 1024 \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$code" \
            -drive if=pflash,format=raw,unit=1,file="$vars" \
            -drive "if=none,id=kurogane_system,format=raw,file=build/images/KuroganeOS-linux.img,snapshot=on,cache=writeback" \
            -device ide-hd,drive=kurogane_system,bus=ide.0,bootindex=1 \
            -netdev user,id=kurogane_net \
            -device e1000,netdev=kurogane_net,mac=52:54:00:4b:55:01 \
            -audiodev driver=none,id=kurogane_audio \
            -device AC97,audiodev=kurogane_audio \
            -serial "file:$serial" \
            -display none \
            -no-reboot \
            -no-shutdown \
            >"$qemu_log" 2>&1 &
          pid=$!

          app=0
          audio_roundtrip=0
          audio_cleanup=0
          for _ in $(seq 1 600); do
            grep -Fq '[TEST] app_registry: PASS' "$serial" 2>/dev/null && app=1
            grep -Fq '[TEST] audio_service_roundtrip: PASS' "$serial" 2>/dev/null && audio_roundtrip=1
            grep -Fq '[TEST] audio_exit_cleanup: PASS' "$serial" 2>/dev/null && audio_cleanup=1
            if grep -Eq '\[TEST\] (app_registry|audio_service_roundtrip): FAIL' "$serial" 2>/dev/null; then
              break
            fi
            if [[ "$app" -eq 1 && "$audio_roundtrip" -eq 1 && "$audio_cleanup" -eq 1 ]]; then
              break
            fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          kill "$pid" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          pid=""
          cat "$qemu_log"
          tail -n 12000 "$serial"

          if grep -Eq '\[TEST\] (app_registry|audio_service_roundtrip): FAIL' "$serial"; then
            echo '3.5 Audio/App qualification emitted failure marker' >&2
            exit 1
          fi
          [[ "$app" -eq 1 ]] || { echo 'app_registry PASS not observed' >&2; exit 1; }
          [[ "$audio_roundtrip" -eq 1 ]] || { echo 'audio_service_roundtrip PASS not observed' >&2; exit 1; }
          [[ "$audio_cleanup" -eq 1 ]] || { echo 'audio_exit_cleanup PASS not observed' >&2; exit 1; }
          grep -F '[TEST] app_registry: PASS' "$serial"
          grep -F '[TEST] audio_service_roundtrip: PASS' "$serial"
          grep -F '[TEST] audio_exit_cleanup: PASS' "$serial"
          echo '[TEST] audio_app_kvm_regression: PASS'
