name: Qualify 7.0 supported-device integration

on:
  pull_request:
    branches:
      - integration/flux8-reconciliation
    paths:
      - '.github/workflows/qualify-7.0-supported-devices.yml'
      - '.gitmodules'
      - 'Makefile'
      - 'linker.ld'
      - 'boot/**'
      - 'common/**'
      - 'config/**'
      - 'kernel/**'
      - 'rootfs/**'
      - 'sdk/**'
      - 'scripts/**'
      - 'tests/**'
      - 'third_party/**'
      - 'userspace/**'
      - 'docs/releases/IRON_SHIELD_7_CLOSEOUT.md'
  push:
    branches:
      - codex/road-to-15-stability
      - agent/iron-shield-7-closeout-20261117
      - integration/flux8-reconciliation
    paths:
      - '.github/workflows/qualify-7.0-supported-devices.yml'
      - '.gitmodules'
      - 'Makefile'
      - 'linker.ld'
      - 'boot/**'
      - 'common/**'
      - 'config/**'
      - 'kernel/**'
      - 'rootfs/**'
      - 'sdk/**'
      - 'scripts/**'
      - 'tests/**'
      - 'third_party/**'
      - 'userspace/**'
  workflow_dispatch:

# Only the newest candidate on a branch needs an expensive full QEMU
# matrix; stale queued runs cannot qualify the current release head.
concurrency:
  # Keep required PR checks distinct from push checks for the same branch.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  integrated-hardware:
    name: Combined QEMU / ${{ matrix.nic }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - nic: e1000
            marker: e1000_link
          - nic: e1000e
            marker: e1000e_link
          - nic: pcnet
            marker: pcnet_link
          - nic: virtio
            marker: virtio_net_link
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify exact dev identity and static regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(bash scripts/read-version.sh common/version.h)" = "7.0.0-dev"
          git diff --check
          bash -n scripts/smoke-uefi-iso-qemu.sh
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 \
            qemu-system-x86 ovmf mtools dosfstools gdisk xorriso
      - name: Full host, syscall and kernel regressions
        run: |
          bash scripts/run-host-tests.sh
          bash scripts/test.sh
      - name: Build fresh release IMG and installation package
        run: |
          bash scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img
          test -s build/install.pkg
      - name: Record source and boot image identities
        run: |
          mkdir -p build/tests/iron-shield-integrated-${{ matrix.nic }}
          git rev-parse HEAD > build/tests/iron-shield-integrated-${{ matrix.nic }}/source-sha.txt
          sha256sum build/images/KuroganeOS-linux.img > build/tests/iron-shield-integrated-${{ matrix.nic }}/media-sha256.txt
      - name: Simultaneous USB HID / networking / VirtIO block / SMP
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk --smp 4 \
            --nic "${{ matrix.nic }}" --require-network --virtio-block \
            --usb-keyboard --usb-mouse --no-ps2 \
            --log-dir build/tests/iron-shield-integrated-${{ matrix.nic }} \
            --timeout 240 \
            --send-key-after-marker '[TEST] red_flux_login_surface: PASS' f12 \
            --click-after-marker '[TEST] red_flux_login_surface: PASS' 40 40 \
            --require-marker '[TEST] xhci_multi_hid_enumeration: PASS' \
            --require-marker '[TEST] usb_hid_keyboard_input: PASS' \
            --require-marker '[TEST] usb_hid_mouse_input: PASS' \
            --require-marker '[TEST] virtio_block_probe: PASS' \
            --require-marker '[TEST] virtio_block_rw: PASS' \
            --require-marker '[TEST] unified_storage_write_flush_readback_restore: PASS' \
            --require-marker '[TEST] ${{ matrix.marker }}: PASS' \
            --require-marker '[TEST] dhcp_lease: PASS' \
            --require-marker '[TEST] network_gateway_icmp: PASS' \
            --require-marker '[TEST] scheduler2_topology: PASS' \
            --require-marker '[TEST] smp_scheduler: PASS' \
            --require-marker '[TEST] ALL_REQUIRED_TESTS_PASSED'
          ! grep -Eq 'PANIC_BEGIN|FATAL ERROR|usb_hid_.*: FAIL|xhci_.*: FAIL|virtio_block_.*: FAIL|dhcp_lease: FAIL' \
            build/tests/iron-shield-integrated-${{ matrix.nic }}/serial.log
      - name: Retain serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-shield-integrated-${{ matrix.nic }}-${{ env.SOURCE_SHA }}
          path: build/tests/iron-shield-integrated-*
          if-no-files-found: warn

  no-nic-fallback:
    name: USB HID and loopback without NIC
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 \
            qemu-system-x86 ovmf mtools dosfstools gdisk xorriso
      - name: Validate candidate, run UBSan, and build Debug kernel and userspace
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(bash scripts/read-version.sh common/version.h)" = "7.0.0-dev"
          bash scripts/test-core-ubsan.sh
          bash scripts/build-linux.sh --configuration debug --rebuild --no-image
      - name: Build release image
        run: |
          bash scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img
      - name: Record candidate source and media identities
        run: |
          mkdir -p build/tests/iron-shield-no-nic
          git rev-parse HEAD > build/tests/iron-shield-no-nic/source-sha.txt
          sha256sum build/images/KuroganeOS-linux.img > build/tests/iron-shield-no-nic/media-sha256.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cp dist/SHA256SUMS.txt build/tests/iron-shield-no-nic/dist-sha256.txt
      - name: Verify USB-only input at Login without a NIC
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk --smp 4 \
            --nic none --usb-keyboard --usb-mouse --no-ps2 \
            --log-dir build/tests/iron-shield-no-nic --timeout 180 \
            --send-key-after-marker '[TEST] red_flux_login_surface: PASS' f12 \
            --click-after-marker '[TEST] red_flux_login_surface: PASS' 40 40 \
            --require-marker '[TEST] xhci_multi_hid_enumeration: PASS' \
            --require-marker '[TEST] usb_hid_keyboard_input: PASS' \
            --require-marker '[TEST] usb_hid_mouse_input: PASS' \
            --require-marker '[TEST] network_loopback: PASS' \
            --require-marker '[TEST] red_flux_login_surface: PASS'
          ! grep -Eq 'PANIC_BEGIN|FATAL ERROR|usb_hid_.*: FAIL|xhci_.*: FAIL|dhcp_lease: PASS|network_gateway_icmp: PASS' \
            build/tests/iron-shield-no-nic/serial.log
      - name: Retain no-NIC serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-shield-no-nic-${{ env.SOURCE_SHA }}
          path: build/tests/iron-shield-no-nic
          if-no-files-found: warn

  supported-device-gate:
    name: Same-SHA supported-device gate
    needs: [integrated-hardware, no-nic-fallback]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail unless the exact-SHA hardware jobs passed
        env:
          INTEGRATED: ${{ needs.integrated-hardware.result }}
          NO_NIC: ${{ needs.no-nic-fallback.result }}
        run: |
          set -euo pipefail
          test "$INTEGRATED" = success
          test "$NO_NIC" = success
          echo "Iron Shield 7.0 QEMU supported-device subset: PASS ($SOURCE_SHA)"
