name: Qualify 3.4.1 event broker roundtrip

on:
  push:
    branches:
      - dev/3.4.1-event-broker
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-event-broker.yml'
      - 'sdk/include/kurogane/event_broker.h'
      - 'sdk/include/kurogane/event.h'
      - 'sdk/include/kurogane/service.h'
      - 'userspace/system/eventd/**'
      - 'userspace/system/event-probe/**'
      - 'userspace/system/init/main.c'
      - 'scripts/build-linux.sh'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'kernel/arch/x86_64/interrupts.cpp'
      - 'kernel/arch/x86_64/interrupts.hpp'
      - 'kernel/arch/x86_64/interrupt_stubs.asm'
      - 'kernel/ipc/**'
      - 'kernel/task/**'
      - 'kernel/user/runtime.cpp'
      - 'kernel/user/runtime_base.inc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-broker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Inject qualification client launch
        shell: python
        run: |
          from pathlib import Path

          path = Path('userspace/system/init/main.c')
          text = path.read_text()
          anchor = '    (void)u_puts("[TEST] event_broker_spawn: PASS\\n");\n'
          replacement = anchor + (
              '    const ku_result_t event_probe_pid = u_spawn("/system/evprobe");\n'
              '    if (event_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] event_broker_roundtrip: FAIL\\n");\n'
              '        ku_exit(8);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one event broker spawn anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk xorriso

      - name: Build media with event broker probe
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require real userspace subscribe publish event roundtrip
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] event_broker_roundtrip: PASS' \
            --timeout 180
