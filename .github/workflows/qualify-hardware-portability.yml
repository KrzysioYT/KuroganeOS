name: Qualify 5.1 Hardware Portability Foundation

on:
  pull_request:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-hardware-portability.yml'
      - 'kernel/hardware/**'
      - 'kernel/main.cpp'
      - 'kernel/input/**'
      - 'kernel/drivers/keyboard.*'
      - 'kernel/drivers/mouse.*'
      - 'kernel/drivers/usb/**'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'scripts/run-host-tests.sh'
      - 'tests/test_hardware_policy.cpp'
      - 'docs/architecture/HARDWARE_COMPATIBILITY.md'
      - 'docs/roadmap/MASTER_ROADMAP_15.md'
      - 'docs/ROADMAP.md'
      - 'docs/ROAD_TO_15_STATUS.md'
      - 'DEVELOPMENT_STATE.md'
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-hardware-portability.yml'
      - 'kernel/hardware/**'
      - 'kernel/main.cpp'
      - 'kernel/input/**'
      - 'kernel/drivers/keyboard.*'
      - 'kernel/drivers/mouse.*'
      - 'kernel/drivers/usb/**'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'scripts/run-host-tests.sh'
      - 'tests/test_hardware_policy.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify source and portability policy
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/smoke-uefi-iso-qemu.sh
          git diff --check
          grep -Fq 'CapabilityLegacyKeyboard' kernel/hardware/policy.hpp
          grep -Fq 'CapabilityLegacyPointer' kernel/hardware/policy.hpp
          ! grep -Fq 'required timer or PS/2 input unavailable' kernel/main.cpp

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 \
            qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Run full host regression
        run: bash ./scripts/run-host-tests.sh

      - name: Build clean release media
        run: |
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Boot with i8042 disabled and real USB HID only
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk --no-ps2 \
            --usb-keyboard --usb-mouse --nic none \
            --log-dir build/tests/hardware-portability-usb-only --timeout 150 \
            --send-key-after-marker '[TEST] red_flux_login_surface: PASS' f12 \
            --click-after-marker '[TEST] red_flux_login_surface: PASS' 40 40 \
            --require-marker '[TEST] hardware_boot_policy: PASS' \
            --require-marker '[TEST] ps2_keyboard: SKIP (optional backend unavailable)' \
            --require-marker '[TEST] ps2_mouse: SKIP (optional backend unavailable)' \
            --require-marker '[TEST] xhci_keyboard_enumeration: PASS' \
            --require-marker '[TEST] xhci_mouse_enumeration: PASS' \
            --require-marker '[TEST] usb_hid_keyboard_input: PASS' \
            --require-marker '[TEST] usb_hid_mouse_input: PASS' \
            --require-marker '[TEST] red_flux_login_surface: PASS'
          ! grep -Eq 'PANIC_BEGIN|FATAL ERROR|hardware_boot_policy: FAIL|usb_hid_.*: FAIL|xhci_.*: FAIL' \
            build/tests/hardware-portability-usb-only/serial.log

      - name: Retain portability logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-portability-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/tests/hardware-portability-usb-only
          if-no-files-found: warn
