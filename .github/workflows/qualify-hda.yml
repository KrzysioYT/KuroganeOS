name: Qualify 5.0 Intel HDA Runtime

on:
  pull_request:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-hda.yml'
      - 'kernel/drivers/audio/**'
      - 'kernel/drivers/builtin_drivers.cpp'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'scripts/run-host-tests.sh'
      - 'tests/test_hda_protocol.cpp'
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-hda.yml'
      - 'kernel/drivers/audio/**'
      - 'kernel/drivers/builtin_drivers.cpp'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'scripts/run-host-tests.sh'
      - 'tests/test_hda_protocol.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hda-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify scripts and diff hygiene
        run: |
          bash -n scripts/smoke-uefi-iso-qemu.sh
          git diff --check

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 \
            qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Run full host regression
        run: bash ./scripts/run-host-tests.sh

      - name: Build clean release media
        run: |
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img
          test -s build/install.pkg

      - name: Require real Intel HDA controller, codec path and PCM DMA
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk --audio hda \
            --log-dir build/tests/hda-runtime --timeout 120 \
            --require-marker '[TEST] hda_controller_reset: PASS' \
            --require-marker '[TEST] hda_codec_identify: PASS' \
            --require-marker '[TEST] hda_pcm_path: PASS' \
            --require-marker '[TEST] hda_pcm_dma: PASS' \
            --require-marker '[TEST] red_flux_login_surface: PASS'
          ! grep -Eq 'PANIC_BEGIN|FATAL ERROR|hda_.*: FAIL' \
            build/tests/hda-runtime/serial.log

      - name: Retain HDA runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hda-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/tests/hda-runtime
          if-no-files-found: warn
