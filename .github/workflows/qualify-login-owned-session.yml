name: Qualify login owned desktop session

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-login-owned-session.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-session-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Inject live-session activation
        shell: python
        run: |
          from pathlib import Path
          path = Path('userspace/gui/login/main.c')
          text = path.read_text()
          anchor = '''    } else {
                  puts(profile.installed_profile
                      ? "[TEST] installed_account_profile: PASS"
                      : "[TEST] live_login_profile: PASS");
              }

              for (;;) {'''
          replacement = '''    } else {
                  puts(profile.installed_profile
                      ? "[TEST] installed_account_profile: PASS"
                      : "[TEST] live_login_profile: PASS");
              }

              /* Qualification-only: live media has no credential gate. */
              if (!profile.installed_profile && profile.profile_valid) {
                  return start_session(window, &profile);
              }

              for (;;) {'''
          if text.count(anchor) != 1:
              raise SystemExit(f'login activation anchor count={text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))

      - name: Validate qualification patch
        run: |
          git diff --check
          grep -F 'red_flux_owned_session: PASS' userspace/gui/login/main.c
          grep -F 'return start_session(window, &profile);' userspace/gui/login/main.c

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require Login to own real desktop session
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] red_flux_owned_session: PASS' \
            --timeout 180
