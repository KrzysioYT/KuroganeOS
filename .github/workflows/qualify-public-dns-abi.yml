name: Qualify 3.5 Public DNS ABI

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-public-dns-abi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Integrate public DNS ABI candidate
        shell: python
        run: |
          from pathlib import Path

          syscall = Path('sdk/include/kurogane/syscall.h')
          text = syscall.read_text()
          anchor = '    KU_SYS_IPC_QUERY = 55\n};\n'
          replacement = '    KU_SYS_IPC_QUERY = 55,\n    KU_SYS_DNS_RESOLVE_A = 56\n};\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'DNS syscall anchor count={text.count(anchor)}')
          syscall.write_text(text.replace(anchor, replacement, 1))

          network = Path('sdk/include/kurogane/network.h')
          text = network.read_text()
          constants = '#define KU_HTTP_FLAG_NONE UINT32_C(0)\n'
          constants_new = constants + (
              '#define KU_DNS_NAME_CAPACITY KU_NET_HOST_CAPACITY\n'
              '#define KU_DNS_FLAG_NONE UINT32_C(0)\n'
          )
          if text.count(constants) != 1:
              raise SystemExit(f'DNS constants anchor count={text.count(constants)}')
          text = text.replace(constants, constants_new, 1)

          struct_anchor = '''typedef struct ku_http_request {
              uint32_t structure_size;
              uint32_t flags;
              char host[KU_NET_HOST_CAPACITY];
              char path[KU_NET_PATH_CAPACITY];
              void* output;
              uint64_t output_capacity;
              uint64_t bytes_received;
              uint32_t http_status;
              uint32_t reserved;
          } ku_http_request;
          '''
          dns_struct = '''typedef struct ku_dns_a_request {
              uint32_t structure_size;
              uint32_t flags;
              char host[KU_DNS_NAME_CAPACITY];
              uint8_t address[4];
              uint32_t reserved;
          } ku_dns_a_request;

          ''' + struct_anchor
          if text.count(struct_anchor) != 1:
              raise SystemExit('DNS request struct anchor changed')
          text = text.replace(struct_anchor, dns_struct, 1)

          wrapper_anchor = '''static inline ku_status_t ku_http_get(ku_http_request* request) {
          '''
          wrapper = '''static inline ku_status_t ku_dns_resolve_a(ku_dns_a_request* request) {
              if (request == NULL) return KU_STATUS_INVALID_ARGUMENT;
              request->flags = KU_DNS_FLAG_NONE;
              request->reserved = 0U;
              return (ku_status_t)ku_syscall3(
                  KU_SYS_DNS_RESOLVE_A,
                  (uint64_t)(uintptr_t)request,
                  (uint64_t)sizeof(ku_dns_a_request),
                  0U);
          }

          ''' + wrapper_anchor
          if text.count(wrapper_anchor) != 1:
              raise SystemExit('DNS wrapper anchor changed')
          network.write_text(text.replace(wrapper_anchor, wrapper, 1))

          runtime = Path('kernel/user/runtime_base.inc')
          text = runtime.read_text()
          runtime_anchor = '        case KU_SYS_AUDIO_STATUS: {\n'
          runtime_case = '''        case KU_SYS_DNS_RESOLVE_A: {
              if (frame.rsi != sizeof(ku_dns_a_request) || frame.rdx != 0U ||
                  !validate_user_buffer(
                      *context, frame.rdi, sizeof(ku_dns_a_request), true)) {
                  frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);
                  return;
              }
              auto* request = reinterpret_cast<ku_dns_a_request*>(
                  static_cast<uintptr_t>(frame.rdi));
              if (request->structure_size != sizeof(*request)) {
                  frame.rax = static_cast<uint64_t>(KU_STATUS_VERSION_MISMATCH);
                  return;
              }
              if (request->flags != KU_DNS_FLAG_NONE || request->reserved != 0U ||
                  !fixed_string_terminated(request->host, sizeof(request->host))) {
                  frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);
                  return;
              }
              net::IPv4Address address{};
              const net::Status status = net::service::resolve_a(request->host, &address);
              if (status == net::Status::Ok) {
                  for (size_t index = 0U; index < 4U; ++index) {
                      request->address[index] = address.bytes[index];
                  }
              }
              frame.rax = static_cast<uint64_t>(network_status(status));
              return;
          }
          ''' + runtime_anchor
          if text.count(runtime_anchor) != 1:
              raise SystemExit(f'DNS runtime anchor count={text.count(runtime_anchor)}')
          runtime.write_text(text.replace(runtime_anchor, runtime_case, 1))

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          build_anchor = '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          build_entry = '    "dnsprobe|userspace/system/dns-probe/main.c|system/dnsprobe|c"\n'
          if text.count(build_anchor) != 1:
              raise SystemExit(f'DNS build anchor count={text.count(build_anchor)}')
          build.write_text(text.replace(build_anchor, build_anchor + build_entry, 1))

          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          init_anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n'
          launch = init_anchor + (
              '    const ku_result_t dns_probe_pid = u_spawn("/system/dnsprobe");\n'
              '    if (dns_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] public_dns_resolve: FAIL code=0\\n");\n'
              '        ku_exit(50);\n'
              '    }\n'
          )
          if text.count(init_anchor) != 1:
              raise SystemExit(f'DNS init anchor count={text.count(init_anchor)}')
          init.write_text(text.replace(init_anchor, launch, 1))

      - name: Validate candidate
        run: |
          git diff --check
          grep -F 'KU_SYS_DNS_RESOLVE_A = 56' sdk/include/kurogane/syscall.h
          grep -F 'ku_dns_resolve_a' sdk/include/kurogane/network.h
          grep -F 'case KU_SYS_DNS_RESOLVE_A:' kernel/user/runtime_base.inc
          grep -F 'system/dnsprobe' scripts/build-linux.sh
          [[ ${#dnsprobe} -le 8 ]]

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require real Ring-3 DNS resolution
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --nic e1000 \
            --require-marker '[TEST] public_dns_resolve: PASS' \
            --timeout 240

      - name: Restore qualification-only launch changes
        run: |
          git checkout -- scripts/build-linux.sh userspace/system/init/main.c

      - name: Land qualified DNS ABI
        run: |
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sdk/include/kurogane/syscall.h sdk/include/kurogane/network.h kernel/user/runtime_base.inc
          git rm .github/workflows/qualify-public-dns-abi.yml
          git commit -m 'network(abi): expose public DNS A resolution'
          git push origin HEAD:gpt/road-to-15-consolidation
