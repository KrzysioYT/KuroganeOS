name: Qualify Service Discovery Lookup

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-service-query.yml'

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Integrate service lookup candidate
        shell: python
        run: |
          from pathlib import Path

          syscall = Path('sdk/include/kurogane/syscall.h')
          text = syscall.read_text()
          anchor = '    KU_SYS_EVENT_CLOSE = 54\n'
          replacement = '    KU_SYS_EVENT_CLOSE = 54,\n    KU_SYS_IPC_QUERY = 55\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'syscall append anchor count={text.count(anchor)}')
          syscall.write_text(text.replace(anchor, replacement, 1))

          service = Path('sdk/include/kurogane/service.h')
          text = service.read_text()
          anchor = '#define KU_SERVICE_NEGOTIATION_ABI_VERSION UINT32_C(1)\n'
          if text.count(anchor) != 1:
              raise SystemExit('service info ABI anchor changed')
          text = text.replace(anchor, anchor + '#define KU_SERVICE_INFO_ABI_VERSION UINT32_C(1)\n', 1)

          struct_anchor = '''typedef struct ku_service_negotiation {
              uint32_t structure_size;
              uint32_t abi_version;
              uint32_t minimum_version;
              uint32_t maximum_version;
              uint32_t selected_version;
              uint32_t service_version;
              uint32_t minimum_client_version;
              uint32_t reserved;
              uint64_t capabilities;
              uint64_t owner_pid;
          } ku_service_negotiation;
          '''
          struct_add = struct_anchor + '''
          typedef struct ku_service_info {
              uint32_t structure_size;
              uint32_t abi_version;
              uint32_t service_version;
              uint32_t minimum_client_version;
              uint64_t capabilities;
              uint64_t owner_pid;
          } ku_service_info;
          '''
          if text.count(struct_anchor) != 1:
              raise SystemExit('service negotiation struct anchor changed')
          text = text.replace(struct_anchor, struct_add, 1)
          text = text.replace(
              'static_assert(sizeof(ku_service_negotiation) == 48, "service negotiation ABI mismatch");',
              'static_assert(sizeof(ku_service_negotiation) == 48, "service negotiation ABI mismatch");\nstatic_assert(sizeof(ku_service_info) == 32, "service info ABI mismatch");', 1)
          text = text.replace(
              '_Static_assert(sizeof(ku_service_negotiation) == 48, "service negotiation ABI mismatch");',
              '_Static_assert(sizeof(ku_service_negotiation) == 48, "service negotiation ABI mismatch");\n_Static_assert(sizeof(ku_service_info) == 32, "service info ABI mismatch");', 1)
          wrapper_anchor = '''static inline ku_result_t ku_service_connect(
              const char* name,
              size_t name_size) {
              ku_service_negotiation negotiation = {
                  sizeof(ku_service_negotiation),
                  KU_SERVICE_NEGOTIATION_ABI_VERSION,
                  KU_SERVICE_DEFAULT_VERSION,
                  KU_SERVICE_DEFAULT_VERSION,
                  0U, 0U, 0U, 0U, UINT64_C(0), UINT64_C(0)
              };
              return ku_service_connect_versioned(name, name_size, &negotiation);
          }
          '''
          wrapper_add = wrapper_anchor + '''
          static inline ku_status_t ku_service_query(
              const char* name,
              size_t name_size,
              ku_service_info* info) {
              if (info == NULL) return KU_STATUS_INVALID_ARGUMENT;
              info->structure_size = sizeof(*info);
              info->abi_version = KU_SERVICE_INFO_ABI_VERSION;
              info->service_version = 0U;
              info->minimum_client_version = 0U;
              info->capabilities = UINT64_C(0);
              info->owner_pid = UINT64_C(0);
              return (ku_status_t)ku_syscall3(
                  KU_SYS_IPC_QUERY,
                  (uint64_t)(uintptr_t)name,
                  (uint64_t)name_size,
                  (uint64_t)(uintptr_t)info);
          }
          '''
          if text.count(wrapper_anchor) != 1:
              raise SystemExit('service query wrapper anchor changed')
          service.write_text(text.replace(wrapper_anchor, wrapper_add, 1))

          header = Path('kernel/ipc/channel.hpp')
          text = header.read_text()
          struct_anchor = '''struct ServiceNegotiation {
              uint32_t minimum_version;
              uint32_t maximum_version;
              uint32_t selected_version;
              uint32_t service_version;
              uint32_t minimum_client_version;
              uint64_t capabilities;
              ProcessId owner_pid;
          };
          '''
          struct_add = struct_anchor + '''
          struct ServiceInfo {
              uint32_t service_version;
              uint32_t minimum_client_version;
              uint64_t capabilities;
              ProcessId owner_pid;
          };
          '''
          if text.count(struct_anchor) != 1:
              raise SystemExit('kernel service info struct anchor changed')
          text = text.replace(struct_anchor, struct_add, 1)
          connect_anchor = '''Status connect(
              ProcessId client_pid,
              const char* name,
              size_t name_length,
              Handle* channel,
              ServiceNegotiation* negotiation = nullptr);
          '''
          query_decl = '''Status query(
              const char* name,
              size_t name_length,
              ServiceInfo* info);
          ''' + connect_anchor
          if text.count(connect_anchor) != 1:
              raise SystemExit('kernel query declaration anchor changed')
          header.write_text(text.replace(connect_anchor, query_decl, 1))

          channel = Path('kernel/ipc/channel.cpp')
          text = channel.read_text()
          connect_anchor = '''Status connect(
              ProcessId client_pid,
              const char* name,
              size_t name_length,
              Handle* channel,
              ServiceNegotiation* negotiation) {
          '''
          query_impl = '''Status query(
              const char* name,
              size_t name_length,
              ServiceInfo* info) {
              if (info != nullptr) *info = {};
              if (!g_initialized) return Status::NotInitialized;
              if (info == nullptr) return Status::InvalidArgument;
              const Status name_status = validate_name(name, name_length);
              if (name_status != Status::Ok) return name_status;
              for (const EndpointSlot& slot : g_endpoints) {
                  if (!slot.active || !name_equal(slot, name, name_length)) continue;
                  if (!slot.versioned) return Status::VersionMismatch;
                  info->service_version = slot.metadata.service_version;
                  info->minimum_client_version = slot.metadata.minimum_client_version;
                  info->capabilities = slot.metadata.capabilities;
                  info->owner_pid = slot.owner_pid;
                  return Status::Ok;
              }
              return Status::NotFound;
          }

          ''' + connect_anchor
          if text.count(connect_anchor) != 1:
              raise SystemExit(f'kernel query implementation anchor count={text.count(connect_anchor)}')
          channel.write_text(text.replace(connect_anchor, query_impl, 1))

          runtime = Path('kernel/user/runtime.cpp')
          text = runtime.read_text()
          predicate = '    return (number >= KU_SYS_IPC_BIND && number <= KU_SYS_IPC_CLOSE) ||\n'
          predicate_new = predicate + '        number == KU_SYS_IPC_QUERY ||\n'
          if text.count(predicate) != 1:
              raise SystemExit(f'runtime syscall predicate anchor count={text.count(predicate)}')
          text = text.replace(predicate, predicate_new, 1)
          switch_anchor = '    switch (frame.rax) {\n        case KU_SYS_IPC_BIND:\n'
          query_case = '''    switch (frame.rax) {
              case KU_SYS_IPC_QUERY: {
                  char name[ipc::MAX_SERVICE_NAME + 1U]{};
                  if (!copy_user_ipc_name(*context, frame.rdi, frame.rsi, name) ||
                      frame.rdx == 0U ||
                      !validate_user_buffer(*context, frame.rdx, sizeof(ku_service_info), true)) {
                      frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);
                      return;
                  }
                  auto* user_info = reinterpret_cast<ku_service_info*>(
                      static_cast<uintptr_t>(frame.rdx));
                  if (user_info->structure_size != sizeof(*user_info) ||
                      user_info->abi_version != KU_SERVICE_INFO_ABI_VERSION) {
                      frame.rax = static_cast<uint64_t>(KU_STATUS_VERSION_MISMATCH);
                      return;
                  }
                  ipc::ServiceInfo info{};
                  const uint64_t interrupt_flags = save_and_disable_interrupts();
                  const ipc::Status status = ipc::query(
                      name, static_cast<size_t>(frame.rsi), &info);
                  restore_interrupts(interrupt_flags);
                  if (status == ipc::Status::Ok) {
                      user_info->service_version = info.service_version;
                      user_info->minimum_client_version = info.minimum_client_version;
                      user_info->capabilities = info.capabilities;
                      user_info->owner_pid = info.owner_pid;
                  }
                  frame.rax = static_cast<uint64_t>(ipc_status(status));
                  return;
              }
              case KU_SYS_IPC_BIND:
          '''
          query_lines = query_case.splitlines(True)
          query_case = query_lines[0] + ''.join(
              ('    ' + line) if line.strip() else line for line in query_lines[1:])
          if text.count(switch_anchor) != 1:
              raise SystemExit(f'runtime query case anchor count={text.count(switch_anchor)}')
          runtime.write_text(text.replace(switch_anchor, query_case, 1))

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          additions = (
              '    "svcmeta|userspace/system/service-meta-server/main.c|system/svcmeta|c"\n'
              '    "svcquery|userspace/system/service-query-probe/main.c|system/svcquery|c"\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('query build anchor changed')
          build.write_text(text.replace(anchor, anchor + additions, 1))

          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n'
          addition = anchor + (
              '    const ku_result_t service_meta_pid = u_spawn("/system/svcmeta");\n'
              '    if (service_meta_pid <= 0) {\n'
              '        (void)u_puts("[TEST] service_lookup: FAIL\\n");\n'
              '        ku_exit(33);\n'
              '    }\n'
              '    const ku_result_t service_query_pid = u_spawn("/system/svcquery");\n'
              '    if (service_query_pid <= 0) {\n'
              '        (void)u_puts("[TEST] service_lookup: FAIL\\n");\n'
              '        ku_exit(34);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('query init anchor changed')
          init.write_text(text.replace(anchor, addition, 1))

      - name: Validate candidate
        run: |
          git diff --check
          grep -F 'KU_SYS_IPC_QUERY = 55' sdk/include/kurogane/syscall.h
          grep -F 'ku_service_query' sdk/include/kurogane/service.h
          grep -F 'Status query(' kernel/ipc/channel.hpp
          grep -F 'number == KU_SYS_IPC_QUERY' kernel/user/runtime.cpp
          grep -F 'system/svcquery' scripts/build-linux.sh

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require side-effect-free discovery lookup
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] service_lookup: PASS' \
            --timeout 180

      - name: Restore qualification-only launch changes
        run: |
          git checkout "$GITHUB_SHA" -- scripts/build-linux.sh userspace/system/init/main.c

      - name: Land qualified service lookup ABI
        run: |
          git rm .github/workflows/qualify-service-query.yml
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sdk/include/kurogane/syscall.h sdk/include/kurogane/service.h \
            kernel/ipc/channel.hpp kernel/ipc/channel.cpp kernel/user/runtime.cpp
          git diff --cached --check
          git commit -m 'service(core): add side-effect-free endpoint lookup'
          git push origin HEAD:gpt/road-to-15-consolidation
