# Qualifies bounded PID1 restart, Ring-3 crash isolation, stale endpoint cleanup, and service-name rebind.
name: Qualify service crash recovery and endpoint rebind

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-service-recovery.yml'

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Integrate bounded PID1 service supervision
        shell: python
        run: |
          from pathlib import Path

          init = Path('userspace/system/init/main.c')
          text = init.read_text()

          helper_anchor = '''static uint64_t spawn_clipboard_service(void) {
              const ku_result_t result = u_spawn(CLIPBOARD_SERVICE_PATH);
              return result > 0 ? (uint64_t)result : 0U;
          }
          '''
          helper = helper_anchor + r'''
          #define SERVICE_RESTART_LIMIT 3U
          #define SERVICE_RESTART_BASE_DELAY UINT64_C(4)

          typedef uint64_t (*service_spawn_fn)(void);

          typedef struct service_watch {
              service_spawn_fn spawn;
              uint64_t pid;
              uint32_t restarts;
              const char* restart_marker;
          } service_watch;

          static int supervise_service(service_watch* watch) {
              int32_t exit_code = 0;
              ku_status_t status;
              uint64_t replacement;
              uint64_t delay;
              if (watch == (service_watch*)0 || watch->pid == 0U ||
                  watch->spawn == (service_spawn_fn)0) return 0;
              status = ku_wait(watch->pid, &exit_code);
              if (status == KU_STATUS_WOULD_BLOCK) return 1;
              if (status != KU_STATUS_OK && status != KU_STATUS_NOT_FOUND) return 0;
              if (watch->restarts >= SERVICE_RESTART_LIMIT) return 0;

              delay = SERVICE_RESTART_BASE_DELAY * (uint64_t)(watch->restarts + 1U);
              (void)u_puts("init: supervised service terminated; restarting\n");
              (void)ku_sleep(delay);
              replacement = watch->spawn();
              if (replacement == 0U) return 0;
              watch->pid = replacement;
              ++watch->restarts;
              if (watch->restart_marker != (const char*)0)
                  (void)u_puts(watch->restart_marker);
              return 1;
          }
          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit('service supervision helper anchor changed')
          text = text.replace(helper_anchor, helper, 1)

          watches_anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n    uint64_t session_pid = spawn_session_gate();\n'
          watches = '''    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");

              service_watch event_watch = {spawn_event_broker, event_broker_pid, 0U, "[TEST] event_broker_restart: PASS\\n"};
              service_watch settings_watch = {spawn_settings_service, settings_service_pid, 0U, "[TEST] settings_service_restart: PASS\\n"};
              service_watch notification_watch = {spawn_notification_service, notification_service_pid, 0U, "[TEST] notification_service_restart: PASS\\n"};
              service_watch account_watch = {spawn_account_service, account_service_pid, 0U, "[TEST] account_service_restart: PASS\\n"};
              service_watch session_service_watch = {spawn_session_service, session_service_pid, 0U, "[TEST] session_service_restart: PASS\\n"};
              service_watch clipboard_watch = {spawn_clipboard_service, clipboard_service_pid, 0U, "[TEST] clipboard_service_restart: PASS\\n"};

              const ku_result_t recovery_probe_pid = u_spawn("/system/svcrecov");
              if (recovery_probe_pid <= 0) {
                  (void)u_puts("[TEST] service_restart_rebind: FAIL\\n");
                  ku_exit(33);
              }

              uint64_t session_pid = spawn_session_gate();
          '''
          if text.count(watches_anchor) != 1:
              raise SystemExit('service watch initialization anchor changed')
          text = text.replace(watches_anchor, watches, 1)

          early_start = text.find('    int32_t service_status = 0;\n    const ku_status_t event_early')
          early_end_marker = '    (void)u_puts("[TEST] clipboard_service_liveness: PASS\\n");\n\n'
          early_end = text.find(early_end_marker, early_start)
          if early_start < 0 or early_end < 0:
              raise SystemExit('early service liveness block changed')
          early_end += len(early_end_marker)
          early = '''    if (!supervise_service(&event_watch)) { (void)u_puts("[TEST] event_broker_liveness: FAIL\\n"); ku_exit(7); }
              (void)u_puts("[TEST] event_broker_liveness: PASS\\n");
              if (!supervise_service(&settings_watch)) { (void)u_puts("[TEST] settings_service_liveness: FAIL\\n"); ku_exit(8); }
              (void)u_puts("[TEST] settings_service_liveness: PASS\\n");
              if (!supervise_service(&notification_watch)) { (void)u_puts("[TEST] notification_service_liveness: FAIL\\n"); ku_exit(9); }
              (void)u_puts("[TEST] notification_service_liveness: PASS\\n");
              if (!supervise_service(&account_watch)) { (void)u_puts("[TEST] account_service_liveness: FAIL\\n"); ku_exit(17); }
              (void)u_puts("[TEST] account_service_liveness: PASS\\n");
              if (!supervise_service(&session_service_watch)) { (void)u_puts("[TEST] session_service_liveness: FAIL\\n"); ku_exit(24); }
              (void)u_puts("[TEST] session_service_liveness: PASS\\n");
              if (!supervise_service(&clipboard_watch)) { (void)u_puts("[TEST] clipboard_service_liveness: FAIL\\n"); ku_exit(29); }
              (void)u_puts("[TEST] clipboard_service_liveness: PASS\\n");

          '''
          text = text[:early_start] + early + text[early_end:]

          loop_start = text.find('        service_status = 0;\n        const ku_status_t event_wait')
          loop_end_marker = '        status = 0;\n        const ku_status_t wait_status = ku_wait(session_pid, &status);'
          loop_end = text.find(loop_end_marker, loop_start)
          if loop_start < 0 or loop_end < 0:
              raise SystemExit('service supervision loop block changed')
          loop = '''        if (!supervise_service(&event_watch)) { (void)u_puts("[TEST] event_broker_liveness: FAIL\\n"); ku_exit(10); }
                  if (!supervise_service(&settings_watch)) { (void)u_puts("[TEST] settings_service_liveness: FAIL\\n"); ku_exit(12); }
                  if (!supervise_service(&notification_watch)) { (void)u_puts("[TEST] notification_service_liveness: FAIL\\n"); ku_exit(14); }
                  if (!supervise_service(&account_watch)) { (void)u_puts("[TEST] account_service_liveness: FAIL\\n"); ku_exit(18); }
                  if (!supervise_service(&session_service_watch)) { (void)u_puts("[TEST] session_service_liveness: FAIL\\n"); ku_exit(25); }
                  if (!supervise_service(&clipboard_watch)) { (void)u_puts("[TEST] clipboard_service_liveness: FAIL\\n"); ku_exit(30); }

          '''
          text = text[:loop_start] + loop + text[loop_end:]
          init.write_text(text)

      - name: Inject qualification crash trigger and recovery build
        shell: python
        run: |
          from pathlib import Path

          daemon = Path('userspace/system/clipboardd/main.c')
          text = daemon.read_text()
          anchor = '    (void)send_response(client->connection, status);\n}\n'
          crash = r'''    (void)send_response(client->connection, status);
              if (status == KU_STATUS_OK && request->operation == KU_CLIPBOARD_SET &&
                  request->format == KU_CLIPBOARD_FORMAT_UTF8 && request->data_size == 11U &&
                  request->data[0] == 'C' && request->data[1] == 'R' && request->data[2] == 'A' &&
                  request->data[3] == 'S' && request->data[4] == 'H' && request->data[5] == '_' &&
                  request->data[6] == 'O' && request->data[7] == 'N' && request->data[8] == 'C' &&
                  request->data[9] == 'E' && request->data[10] == 0U) {
                  (void)u_puts("[TEST] clipboard_service_forced_crash: PASS\n");
                  __asm__ volatile("ud2");
              }
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit('clipboard crash injection anchor changed')
          daemon.write_text(text.replace(anchor, crash, 1))

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          addition = '    "svcrecov|userspace/system/service-recovery-probe/main.c|system/svcrecov|c"\n'
          if text.count(anchor) != 1:
              raise SystemExit('recovery probe build anchor changed')
          build.write_text(text.replace(anchor, anchor + addition, 1))

      - name: Validate candidate
        run: |
          git diff --check
          grep -F 'SERVICE_RESTART_LIMIT 3U' userspace/system/init/main.c
          grep -F '[TEST] clipboard_service_restart: PASS' userspace/system/init/main.c
          grep -F '__asm__ volatile("ud2")' userspace/system/clipboardd/main.c
          grep -F 'system/svcrecov' scripts/build-linux.sh

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require crash detection restart stale cleanup and rebind
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk \
            --require-marker '[TEST] clipboard_service_forced_crash: PASS' \
            --require-marker '[TEST] clipboard_service_restart: PASS' \
            --require-marker '[TEST] service_restart_rebind: PASS' \
            --timeout 180

      - name: Remove qualification-only recovery hooks
        shell: python
        run: |
          from pathlib import Path
          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          probe = (
              '    const ku_result_t recovery_probe_pid = u_spawn("/system/svcrecov");\n'
              '    if (recovery_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] service_restart_rebind: FAIL\\n");\n'
              '        ku_exit(33);\n'
              '    }\n\n'
          )
          if text.count(probe) != 1:
              raise SystemExit('recovery probe init stanza changed')
          init.write_text(text.replace(probe, '', 1))

      - name: Restore qualification-only source changes
        run: |
          git checkout "$GITHUB_SHA" -- userspace/system/clipboardd/main.c scripts/build-linux.sh

      - name: Land qualified bounded service recovery
        run: |
          git rm .github/workflows/qualify-service-recovery.yml
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add userspace/system/init/main.c
          git commit -m 'service(init): restart crashed system services with bounded backoff'
          git push origin HEAD:gpt/road-to-15-consolidation
