name: Qualify Session Service integration

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-session-integration.yml'

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Integrate Session Service and qualification probes
        shell: python
        run: |
          from pathlib import Path

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "accountprobe|userspace/system/account-probe/main.c|system/acctprb|c"\n'
          addition = (
              '    "sessiond|userspace/system/sessiond/main.c|system/sessiond|c"\n'
              '    "sessionprobe|userspace/system/session-probe/main.c|system/sesprobe|c"\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'build session anchor count={text.count(anchor)}')
          build.write_text(text.replace(anchor, anchor + addition, 1))

          init = Path('userspace/system/init/main.c')
          text = init.read_text()

          define_anchor = '#define ACCOUNT_SERVICE_PATH "/system/accountd"\n'
          if text.count(define_anchor) != 1:
              raise SystemExit('session define anchor changed')
          text = text.replace(
              define_anchor,
              define_anchor + '#define SESSION_SERVICE_PATH "/system/sessiond"\n', 1)

          spawn_anchor = '''static uint64_t spawn_account_service(void) {
              const ku_result_t result = u_spawn(ACCOUNT_SERVICE_PATH);
              return result > 0 ? (uint64_t)result : 0U;
          }
          '''
          spawn_new = spawn_anchor + '''
          static uint64_t spawn_session_service(void) {
              const ku_result_t result = u_spawn(SESSION_SERVICE_PATH);
              return result > 0 ? (uint64_t)result : 0U;
          }
          '''
          if text.count(spawn_anchor) != 1:
              raise SystemExit('session spawn helper anchor changed')
          text = text.replace(spawn_anchor, spawn_new, 1)

          startup_anchor = '    (void)u_puts("[TEST] account_service_spawn: PASS\\n");\n\n'
          startup = startup_anchor + (
              '    const uint64_t session_service_pid = spawn_session_service();\n'
              '    if (session_service_pid == 0U) {\n'
              '        (void)u_puts("init: cannot spawn /system/sessiond\\n");\n'
              '        (void)u_puts("[TEST] session_service_spawn: FAIL\\n");\n'
              '        ku_exit(20);\n'
              '    }\n'
              '    (void)u_puts("[TEST] session_service_spawn: PASS\\n");\n'
              '    const ku_result_t session_probe_pid = u_spawn("/system/sesprobe");\n'
              '    if (session_probe_pid <= 0) ku_exit(23);\n\n'
          )
          if text.count(startup_anchor) != 1:
              raise SystemExit('session startup anchor changed')
          text = text.replace(startup_anchor, startup, 1)

          event_anchor = '    (void)u_puts("[TEST] event_broker_spawn: PASS\\n");\n'
          event_probe = (
              '    const ku_result_t event_probe_pid = u_spawn("/system/evprobe");\n'
              '    if (event_probe_pid <= 0) ku_exit(21);\n'
          )
          notification_anchor = '    (void)u_puts("[TEST] notification_service_spawn: PASS\\n");\n'
          notification_probe = (
              '    const ku_result_t notification_probe_pid = u_spawn("/system/ntfprobe");\n'
              '    if (notification_probe_pid <= 0) ku_exit(22);\n'
          )
          if text.count(event_anchor) != 1 or text.count(notification_anchor) != 1:
              raise SystemExit('regression probe anchors changed')
          text = text.replace(event_anchor, event_anchor + event_probe, 1)
          text = text.replace(notification_anchor, notification_anchor + notification_probe, 1)

          liveness_anchor = '    (void)u_puts("[TEST] account_service_liveness: PASS\\n");\n\n'
          liveness = liveness_anchor + (
              '    service_status = 0;\n'
              '    const ku_status_t session_service_early = ku_wait(session_service_pid, &service_status);\n'
              '    if (session_service_early != KU_STATUS_WOULD_BLOCK) {\n'
              '        (void)u_puts("[TEST] session_service_liveness: FAIL\\n");\n'
              '        ku_exit(24);\n'
              '    }\n'
              '    (void)u_puts("[TEST] session_service_liveness: PASS\\n");\n\n'
          )
          if text.count(liveness_anchor) != 1:
              raise SystemExit('session liveness anchor changed')
          text = text.replace(liveness_anchor, liveness, 1)

          loop_anchor = '''        status = 0;
                  const ku_status_t wait_status = ku_wait(session_pid, &status);'''
          loop_new = '''        service_status = 0;
                  const ku_status_t session_service_wait = ku_wait(session_service_pid, &service_status);
                  if (session_service_wait == KU_STATUS_OK || session_service_wait == KU_STATUS_NOT_FOUND) {
                      (void)u_puts("init: session service terminated\\n");
                      (void)u_puts("[TEST] session_service_liveness: FAIL\\n");
                      ku_exit(25);
                  }
                  if (session_service_wait != KU_STATUS_WOULD_BLOCK) {
                      (void)u_puts("init: session service supervision failed\\n");
                      ku_exit(26);
                  }

                  status = 0;
                  const ku_status_t wait_status = ku_wait(session_pid, &status);'''
          if text.count(loop_anchor) != 1:
              raise SystemExit(f'session supervision anchor count={text.count(loop_anchor)}')
          init.write_text(text.replace(loop_anchor, loop_new, 1))

      - name: Validate candidate
        run: |
          git diff --check
          grep -F 'system/sessiond' scripts/build-linux.sh
          grep -F 'system/sesprobe' scripts/build-linux.sh
          grep -F '[TEST] session_service_liveness: PASS' userspace/system/init/main.c
          [[ ${#sessiond} -le 8 ]]
          [[ ${#sesprobe} -le 8 ]]

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require Session lifecycle and regressions
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] session_service_roundtrip: PASS' \
            --require-marker '[TEST] event_broker_roundtrip: PASS' \
            --require-marker '[TEST] notification_service_roundtrip: PASS' \
            --timeout 180

      - name: Remove qualification-only probe launches
        shell: python
        run: |
          from pathlib import Path
          path = Path('userspace/system/init/main.c')
          text = path.read_text()
          stanzas = [
              (
                  '    const ku_result_t session_probe_pid = u_spawn("/system/sesprobe");\n'
                  '    if (session_probe_pid <= 0) ku_exit(23);\n\n'
              ),
              (
                  '    const ku_result_t event_probe_pid = u_spawn("/system/evprobe");\n'
                  '    if (event_probe_pid <= 0) ku_exit(21);\n'
              ),
              (
                  '    const ku_result_t notification_probe_pid = u_spawn("/system/ntfprobe");\n'
                  '    if (notification_probe_pid <= 0) ku_exit(22);\n'
              ),
          ]
          for stanza in stanzas:
              if text.count(stanza) != 1:
                  raise SystemExit('qualification probe stanza changed')
              text = text.replace(stanza, '', 1)
          path.write_text(text)

      - name: Land qualified Session integration
        run: |
          git rm .github/workflows/qualify-session-integration.yml
          if [[ -f .github/workflows/qualify-services-post-account.yml ]]; then
            git rm .github/workflows/qualify-services-post-account.yml
          fi
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build-linux.sh userspace/system/init/main.c
          git commit -m 'service(session): integrate owned session lifecycle'
          git push origin HEAD:gpt/road-to-15-consolidation
