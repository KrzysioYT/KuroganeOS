name: Qualify 3.4.2 settings service persistence

on:
  push:
    branches:
      - dev/3.4.2-settings-service
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-settings-service.yml'
      - 'sdk/include/kurogane/settings.h'
      - 'sdk/include/kurogane/service.h'
      - 'sdk/include/kurogane/filesystem.h'
      - 'userspace/system/settingsd/**'
      - 'userspace/system/settings-probe/**'
      - 'userspace/system/init/main.c'
      - 'scripts/build-linux.sh'
      - 'scripts/build-media-linux.sh'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'kernel/arch/x86_64/interrupts.cpp'
      - 'kernel/arch/x86_64/interrupts.hpp'
      - 'kernel/arch/x86_64/interrupt_stubs.asm'
      - 'kernel/arch/x86_64/user_entry.asm'
      - 'kernel/fs/**'
      - 'kernel/ipc/**'
      - 'kernel/task/**'
      - 'kernel/user/runtime.cpp'
      - 'kernel/user/runtime_base.inc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settings-persistence-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Commit address-space frame ownership fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/task/thread.cpp')
          text = path.read_text()
          old = '''Status bind_address_space(
              memory::kernel_virtual_memory::OwnedAddressSpace* address_space,
              uintptr_t user_stack) {
              if (!g_initialized) return Status::NotInitialized;
              if (g_current == kInvalidSlot) return Status::NotRunning;
              Slot& slot = g_slots[g_current];
          #if defined(KUROGANE_HOST_TEST)
              static_cast<void>(address_space);
              slot.address_space_root = 0U;
          #else
              slot.address_space = address_space;
              slot.address_space_root = address_space == nullptr
                  ? memory::kernel_virtual_memory::root_table_physical()
                  : address_space->address_space.root_table_physical;
          #endif
              slot.user_stack = user_stack;
              return Status::Ok;
          }
          '''
          new = '''Status bind_address_space(
              memory::kernel_virtual_memory::OwnedAddressSpace* address_space,
              uintptr_t user_stack) {
              if (!g_initialized) return Status::NotInitialized;
              const uint64_t flags = save_and_disable_interrupts();
              if (g_current == kInvalidSlot) {
                  restore_interrupts(flags);
                  return Status::NotRunning;
              }
              Slot& slot = g_slots[g_current];
              const bool detaching_process =
                  address_space == nullptr && slot.process_id != 0U;
              const bool invalid_detach_state =
                  detaching_process && slot.state != State::Running;
              if (detaching_process) {
                  // A resumable Ring-3 frame is owned by the process address
                  // space. Revoke it before runtime unregisters/destroys that
                  // address space so a later scheduler batch cannot IRET into
                  // memory whose Context/CR3 ownership has already ended.
                  slot.interrupt_frame = nullptr;
                  slot.wake_tick = 0U;
                  slot.yield_requested = false;
              }
          #if defined(KUROGANE_HOST_TEST)
              static_cast<void>(address_space);
              slot.address_space_root = 0U;
          #else
              slot.address_space = address_space;
              slot.address_space_root = address_space == nullptr
                  ? memory::kernel_virtual_memory::root_table_physical()
                  : address_space->address_space.root_table_physical;
          #endif
              slot.user_stack = user_stack;
              restore_interrupts(flags);
              if (invalid_detach_state) {
                  log::write(
                      log::Level::Error,
                      "THREAD",
                      "process address-space detached outside Running state");
                  return Status::CorruptContext;
              }
              return Status::Ok;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one bind_address_space implementation, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          # Restore the normal qualification workflow in the production commit
          # and remove the unused one-shot helper created during diagnosis.
          git show HEAD^:.github/workflows/qualify-settings-service.yml > .github/workflows/qualify-settings-service.yml
          git rm --ignore-unmatch .github/workflows/apply-ring3-retire-fix.yml

          git config user.name 'KuroganeOS Road-to-15'
          git config user.email '59750414+KrzysioYT@users.noreply.github.com'
          git add kernel/task/thread.cpp .github/workflows/qualify-settings-service.yml
          git diff --cached --check
          git commit -m 'runtime: revoke saved Ring-3 frame on address-space detach'
          git push origin HEAD:gpt/road-to-15-consolidation

      - name: Inject settings qualification probe launch
        shell: python
        run: |
          from pathlib import Path

          path = Path('userspace/system/init/main.c')
          text = path.read_text()
          anchor = '    (void)u_puts("[TEST] settings_service_spawn: PASS\\n");\n'
          replacement = anchor + (
              '    const ku_result_t settings_probe_pid = u_spawn("/system/setprobe");\n'
              '    if (settings_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] settings_service_roundtrip: FAIL\\n");\n'
              '        ku_exit(12);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one settings service spawn anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk xorriso

      - name: Build media with settings service and probe
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: First boot writes typed settings to persistent disk
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --persistent-disk \
            --require-marker '[TEST] settings_service_persist_write: PASS' \
            --timeout 180

      - name: Second boot reloads settings from persistent disk
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --persistent-disk \
            --require-marker '[TEST] settings_service_persist_reload: PASS' \
            --timeout 180
