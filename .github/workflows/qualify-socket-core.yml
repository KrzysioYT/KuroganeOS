name: Qualify 3.5 Socket Core

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-socket-core.yml'
      - '.github/workflows/qualify-dns-service.yml'
      - '.github/workflows/qualify-system-services-closeout.yml'
      - '.github/workflows/qualify-3.4-regression-sweep.yml'
      - 'kernel/net/socket.cpp'
      - 'kernel/net/socket.hpp'
      - 'kernel/net/tcp_client.cpp'
      - 'kernel/net/tcp_client.hpp'
      - 'kernel/net/network.cpp'
      - 'kernel/net/network.hpp'
      - 'kernel/net/protocols.cpp'
      - 'kernel/net/protocols.hpp'
      - 'kernel/task/thread.cpp'
      - 'kernel/task/thread.hpp'
      - 'kernel/user/runtime.cpp'
      - 'kernel/user/runtime.hpp'
      - 'kernel/user/runtime_base.inc'
      - 'sdk/include/kurogane/network.h'
      - 'sdk/include/kurogane/dns_service.h'
      - 'sdk/include/kurogane/status.h'
      - 'sdk/include/kurogane/syscall.h'
      - 'userspace/system/init/main.c'
      - 'userspace/system/socket-probe/**'
      - 'userspace/system/socket-exit-worker/**'
      - 'userspace/system/socket-wake-worker/**'
      - 'userspace/system/tcp-exit-worker/**'
      - 'userspace/system/dnsd/**'
      - 'userspace/system/dns-probe/**'
      - 'userspace/system/app-registryd/**'
      - 'rootfs/apps/appman/**'
      - 'tests/test_socket.cpp'
      - 'tests/test_dns_protocol.cpp'
      - 'tests/test_thread.cpp'
      - 'tests/test_sdk_abi.cpp'
      - 'tests/test_install_package_paths.py'
      - 'scripts/run-host-tests.sh'
      - 'scripts/build-install-package.py'
      - 'scripts/build-linux.sh'
      - 'scripts/build-media-linux.sh'
      - 'scripts/smoke-uefi-iso-qemu.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socket-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Build socket ownership host regression
        run: |
          mkdir -p build/tests/host
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DKUROGANE_HOST_TEST -ffunction-sections -fdata-sections \
            tests/test_socket.cpp kernel/net/socket.cpp kernel/net/tcp_client.cpp \
            -Wl,--gc-sections \
            -o build/tests/host/test_socket

      - name: Run socket ownership host regression
        run: build/tests/host/test_socket

      - name: Inject Ring-3 socket qualification probes
        shell: python
        run: |
          from pathlib import Path

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          addition = (
              '    "socketexit|userspace/system/socket-exit-worker/main.c|system/sockexit|c"\n'
              '    "socketwake|userspace/system/socket-wake-worker/main.c|system/sockwake|c"\n'
              '    "tcpexit|userspace/system/tcp-exit-worker/main.c|system/tcpexit|c"\n'
              '    "socketprobe|userspace/system/socket-probe/main.c|system/sockprb|c"\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'socket build anchor count={text.count(anchor)}')
          build.write_text(text.replace(anchor, anchor + addition, 1))

          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          start_anchor = '__attribute__((noreturn)) void _start(void) {\n'
          wait_helper = (
              'static int socket_wait_probe(uint64_t pid) {\n'
              '    uint32_t attempts;\n'
              '    for (attempts = 0U; attempts < 4000U; ++attempts) {\n'
              '        int32_t exit_code = 0;\n'
              '        const ku_status_t status = ku_wait(pid, &exit_code);\n'
              '        if (status == KU_STATUS_OK) return exit_code == 0;\n'
              '        if (status != KU_STATUS_WOULD_BLOCK) return 0;\n'
              '        (void)ku_sleep(1U);\n'
              '    }\n'
              '    return 0;\n'
              '}\n\n'
          )
          if text.count(start_anchor) != 1:
              raise SystemExit(f'socket init start anchor count={text.count(start_anchor)}')
          text = text.replace(start_anchor, wait_helper + start_anchor, 1)

          anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n'
          probe = anchor + (
              '    const ku_result_t socket_probe_pid = u_spawn("/system/sockprb");\n'
              '    if (socket_probe_pid <= 0 || !socket_wait_probe((uint64_t)socket_probe_pid)) {\n'
              '        (void)u_puts("init: socket Ring-3 qualification failed\\n");\n'
              '        ku_exit(50);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'socket init probe anchor count={text.count(anchor)}')
          init.write_text(text.replace(anchor, probe, 1))

      - name: Validate qualification patch
        run: |
          git diff --check
          grep -F 'system/sockexit' scripts/build-linux.sh
          grep -F 'system/sockwake' scripts/build-linux.sh
          grep -F 'system/tcpexit' scripts/build-linux.sh
          grep -F 'system/sockprb' scripts/build-linux.sh
          grep -F 'socket_wait_probe' userspace/system/init/main.c
          grep -F 'u_spawn("/system/sockprb")' userspace/system/init/main.c

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 iptables \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require real Ring-3 socket and TCP runtime markers
        run: |
          mkdir -p build/tests/runtime
          python3 -u - <<'PY' >build/tests/runtime/tcp-host-server.log 2>&1 &
          import socket
          import struct
          import threading
          import time

          PING = b'KURO-TCP-PING'
          PONG = b'KURO-TCP-PONG'

          def normal_connection(connection):
              connection.settimeout(12.0)
              try:
                  payload = connection.recv(64)
                  if payload == PING:
                      connection.sendall(PONG)
                      time.sleep(0.10)
                      connection.shutdown(socket.SHUT_WR)
              except OSError:
                  pass
              finally:
                  connection.close()

          def reset_connection(connection):
              time.sleep(0.75)
              try:
                  connection.setsockopt(
                      socket.SOL_SOCKET,
                      socket.SO_LINGER,
                      struct.pack('ii', 1, 0))
              finally:
                  connection.close()

          def local_close_connection(connection):
              connection.settimeout(15.0)
              try:
                  while connection.recv(128):
                      pass
              except OSError:
                  pass
              finally:
                  connection.close()

          def listen(port, handler):
              server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind(('0.0.0.0', port))
              server.listen(32)
              while True:
                  connection, _ = server.accept()
                  threading.Thread(
                      target=handler, args=(connection,), daemon=True).start()

          threading.Thread(
              target=listen, args=(18080, normal_connection), daemon=True).start()
          threading.Thread(
              target=listen, args=(18083, reset_connection), daemon=True).start()
          threading.Thread(
              target=listen, args=(18084, local_close_connection), daemon=True).start()
          threading.Event().wait()
          PY
          server_pid=$!

          sudo iptables -I OUTPUT 1 -p tcp --dport 18082 -j DROP
          cleanup() {
            sudo iptables -D OUTPUT -p tcp --dport 18082 -j DROP >/dev/null 2>&1 || true
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          sleep 1

          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --nic e1000 \
            --require-network \
            --require-marker '[TEST] socket_udp_roundtrip: PASS' \
            --require-marker '[TEST] socket_readiness: PASS' \
            --require-marker '[TEST] socket_handle_generation: PASS' \
            --require-marker '[TEST] socket_exit_cleanup: PASS' \
            --require-marker '[TEST] tcp_progression: PASS' \
            --require-marker '[TEST] tcp_cleanup: PASS' \
            --timeout 240
