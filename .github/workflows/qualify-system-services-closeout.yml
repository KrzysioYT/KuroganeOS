# Requalified after the FAT32 short-name case fix; keep this gate tied to production code.
name: Qualify 3.4 System Services Closeout

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-system-services-closeout.yml'
      - '.github/workflows/qualify-3.4-regression-sweep.yml'
      - '.github/workflows/qualify-socket-core.yml'
      - 'scripts/build-install-package.py'
      - 'scripts/build-linux.sh'
      - 'scripts/build-media-linux.sh'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'sdk/include/kurogane/**'
      - 'userspace/system/**'
      - 'kernel/ipc/**'
      - 'kernel/task/**'
      - 'kernel/user/**'
      - 'kernel/fs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system-services-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Inject combined 3.4 qualification probes
        shell: python
        run: |
          from pathlib import Path

          build = Path('scripts/build-linux.sh')
          text = build.read_text()
          anchor = '    "clipboardprobe|userspace/system/clipboard-probe/main.c|system/clipprb|c"\n'
          addition = (
              '    "filesystemprobe|userspace/system/filesystem-probe/main.c|system/fsprobe|c"\n'
              '    "svcmeta|userspace/system/service-meta-server/main.c|system/svcmeta|c"\n'
              '    "svcneg|userspace/system/service-meta-probe/main.c|system/svcneg|c"\n'
              '    "svclook|userspace/system/service-query-probe/main.c|system/svclook|c"\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'closeout build anchor count={text.count(anchor)}')
          build.write_text(text.replace(anchor, anchor + addition, 1))

          init = Path('userspace/system/init/main.c')
          text = init.read_text()
          start_anchor = '__attribute__((noreturn)) void _start(void) {\n'
          wait_helper = (
              'static int closeout_wait_probe(uint64_t pid) {\n'
              '    uint32_t attempts;\n'
              '    for (attempts = 0U; attempts < 2000U; ++attempts) {\n'
              '        int32_t exit_code = 0;\n'
              '        const ku_status_t status = ku_wait(pid, &exit_code);\n'
              '        if (status == KU_STATUS_OK) return exit_code == 0;\n'
              '        if (status != KU_STATUS_WOULD_BLOCK) return 0;\n'
              '        (void)ku_sleep(1U);\n'
              '    }\n'
              '    return 0;\n'
              '}\n\n'
          )
          if text.count(start_anchor) != 1:
              raise SystemExit(f'closeout start anchor count={text.count(start_anchor)}')
          text = text.replace(start_anchor, wait_helper + start_anchor, 1)

          anchor = '    (void)u_puts("[TEST] clipboard_service_spawn: PASS\\n");\n'
          probes = anchor + (
              '    const ku_result_t closeout_svcmeta_pid = u_spawn("/system/svcmeta");\n'
              '    if (closeout_svcmeta_pid <= 0) ku_exit(40);\n'
              '    ku_result_t closeout_probe_pid = u_spawn("/system/evprobe");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(41);\n'
              '    closeout_probe_pid = u_spawn("/system/ntfprobe");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(42);\n'
              '    closeout_probe_pid = u_spawn("/system/acctprb");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(43);\n'
              '    closeout_probe_pid = u_spawn("/system/sesprobe");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(44);\n'
              '    closeout_probe_pid = u_spawn("/system/setchprb");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(45);\n'
              '    closeout_probe_pid = u_spawn("/system/clipprb");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(46);\n'
              '    closeout_probe_pid = u_spawn("/system/fsprobe");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(47);\n'
              '    closeout_probe_pid = u_spawn("/system/svcneg");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(48);\n'
              '    closeout_probe_pid = u_spawn("/system/svclook");\n'
              '    if (closeout_probe_pid <= 0 || !closeout_wait_probe((uint64_t)closeout_probe_pid)) ku_exit(49);\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'closeout init anchor count={text.count(anchor)}')
          init.write_text(text.replace(anchor, probes, 1))

      - name: Validate closeout patch
        run: |
          git diff --check
          grep -F 'system/fsprobe' scripts/build-linux.sh
          grep -F 'system/svcmeta' scripts/build-linux.sh
          grep -F 'system/svcneg' scripts/build-linux.sh
          grep -F 'system/svclook' scripts/build-linux.sh
          grep -F 'closeout_wait_probe' userspace/system/init/main.c
          grep -F 'system/setchprb' userspace/system/init/main.c
          [[ ${#fsprobe} -le 8 ]]
          [[ ${#svcmeta} -le 8 ]]
          [[ ${#svcneg} -le 8 ]]
          [[ ${#svclook} -le 8 ]]

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require combined 3.4 Ring-3 service contract
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] event_broker_roundtrip: PASS' \
            --require-marker '[TEST] notification_service_roundtrip: PASS' \
            --require-marker '[TEST] account_service_roundtrip: PASS' \
            --require-marker '[TEST] session_service_roundtrip: PASS' \
            --require-marker '[TEST] settings_change_notification: PASS' \
            --require-marker '[TEST] clipboard_service_roundtrip: PASS' \
            --require-marker '[TEST] filesystem_service_api: PASS' \
            --require-marker '[TEST] service_version_negotiation: PASS' \
            --require-marker '[TEST] service_lookup: PASS' \
            --require-marker '[TEST] event_broker_liveness: PASS' \
            --require-marker '[TEST] settings_service_liveness: PASS' \
            --require-marker '[TEST] notification_service_liveness: PASS' \
            --require-marker '[TEST] account_service_liveness: PASS' \
            --require-marker '[TEST] session_service_liveness: PASS' \
            --require-marker '[TEST] clipboard_service_liveness: PASS' \
            --timeout 240
