name: Qualify 5.0 xHCI USB Mouse

on:
  pull_request:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-usb-mouse.yml'
      - 'kernel/drivers/usb/**'
      - 'kernel/drivers/mouse_protocol.*'
      - 'kernel/input/**'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'scripts/run-host-tests.sh'
      - 'tests/test_usb*'
      - 'tests/test_input.cpp'
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/qualify-usb-mouse.yml'
      - 'kernel/drivers/usb/**'
      - 'kernel/drivers/mouse_protocol.*'
      - 'kernel/input/**'
      - 'scripts/smoke-uefi-iso-qemu.sh'
      - 'scripts/run-host-tests.sh'
      - 'tests/test_usb*'
      - 'tests/test_input.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usb-mouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify scripts and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/smoke-uefi-iso-qemu.sh
          git diff --check

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 \
            qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Run full host regression
        run: bash ./scripts/run-host-tests.sh

      - name: Build clean release media
        run: |
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img
          test -s build/install.pkg

      - name: Preserve xHCI keyboard runtime
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk --usb-keyboard \
            --log-dir build/tests/usb-keyboard-regression --timeout 120 \
            --send-key-after-marker '[TEST] red_flux_login_surface: PASS' f12 \
            --require-marker '[TEST] xhci_keyboard_enumeration: PASS' \
            --require-marker '[TEST] usb_hid_keyboard_input: PASS' \
            --require-marker '[TEST] red_flux_login_surface: PASS'
          ! grep -Eq 'PANIC_BEGIN|FATAL ERROR|usb_hid_.*: FAIL|xhci_.*: FAIL' \
            build/tests/usb-keyboard-regression/serial.log

      - name: Require real xHCI USB mouse delivery
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img --disk --usb-mouse \
            --log-dir build/tests/usb-mouse-runtime --timeout 120 \
            --click-after-marker '[TEST] red_flux_login_surface: PASS' 40 40 \
            --require-marker '[TEST] xhci_mouse_enumeration: PASS' \
            --require-marker '[TEST] usb_hid_mouse_input: PASS' \
            --require-marker '[TEST] red_flux_login_surface: PASS'
          ! grep -Eq 'PANIC_BEGIN|FATAL ERROR|usb_hid_.*: FAIL|xhci_.*: FAIL' \
            build/tests/usb-mouse-runtime/serial.log

      - name: Retain serial and QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-mouse-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/tests/usb-keyboard-regression
            build/tests/usb-mouse-runtime
          if-no-files-found: warn
