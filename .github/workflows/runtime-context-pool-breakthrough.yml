name: Runtime context pool breakthrough

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/runtime-context-pool-breakthrough.yml'

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Move long-lived Ring-3 Contexts off thread stacks
        shell: python
        run: |
          from pathlib import Path

          path = Path('kernel/user/runtime_base.inc')
          text = path.read_text()

          globals_old = '''bool g_initialized = false;
          Context* g_contexts[kMaximumContexts]{};
          uint64_t g_process_identity = 0U;
          uint64_t g_audio_owner_pid = 0U;
          '''
          globals_new = '''bool g_initialized = false;
          Context* g_contexts[kMaximumContexts]{};
          Context g_context_storage[kMaximumContexts]{};
          bool g_context_storage_used[kMaximumContexts]{};
          uint64_t g_process_identity = 0U;
          uint64_t g_audio_owner_pid = 0U;
          '''
          if text.count(globals_old) != 1:
              raise SystemExit('runtime globals anchor changed')
          text = text.replace(globals_old, globals_new, 1)

          restore_anchor = '''void restore_interrupts(uint64_t flags) {
              __asm__ volatile(
                  "pushq %0; popfq"
                  :
                  : "r"(flags)
                  : "memory", "cc");
          }

          Context* current_context() {
          '''
          restore_replacement = '''void restore_interrupts(uint64_t flags) {
              __asm__ volatile(
                  "pushq %0; popfq"
                  :
                  : "r"(flags)
                  : "memory", "cc");
          }

          Context* acquire_context_storage() {
              const uint64_t flags = save_and_disable_interrupts();
              for (size_t index = 0U; index < kMaximumContexts; ++index) {
                  if (g_context_storage_used[index]) continue;
                  g_context_storage_used[index] = true;
                  g_context_storage[index] = {};
                  restore_interrupts(flags);
                  return &g_context_storage[index];
              }
              restore_interrupts(flags);
              return nullptr;
          }

          void release_context_storage(Context* context) {
              if (context == nullptr) return;
              const uint64_t flags = save_and_disable_interrupts();
              for (size_t index = 0U; index < kMaximumContexts; ++index) {
                  if (&g_context_storage[index] != context) continue;
                  g_context_storage[index] = {};
                  g_context_storage_used[index] = false;
                  break;
              }
              restore_interrupts(flags);
          }

          Context* current_context() {
          '''
          if text.count(restore_anchor) != 1:
              raise SystemExit('restore/current_context anchor changed')
          text = text.replace(restore_anchor, restore_replacement, 1)

          init_old = '''    for (Context*& context : g_contexts) context = nullptr;
              if (!arch::x86_64::interrupts::register_handler(kSyscallVector, syscall_handler) ||
          '''
          init_new = '''    for (Context*& context : g_contexts) context = nullptr;
              for (size_t index = 0U; index < kMaximumContexts; ++index) {
                  g_context_storage[index] = {};
                  g_context_storage_used[index] = false;
              }
              if (!arch::x86_64::interrupts::register_handler(kSyscallVector, syscall_handler) ||
          '''
          if text.count(init_old) != 1:
              raise SystemExit('runtime initialize anchor changed')
          text = text.replace(init_old, init_new, 1)

          context_old = '''    Context context{};
              context.pid = pid;
          '''
          context_new = '''    Context* context_storage = acquire_context_storage();
              if (context_storage == nullptr) {
                  memory::kfree(file_bytes);
                  return Status::Busy;
              }
              Context& context = *context_storage;
              context.pid = pid;
          '''
          if text.count(context_old) != 1:
              raise SystemExit('stack-local Context anchor changed')
          text = text.replace(context_old, context_new, 1)

          replacements = {
              '''        memory::kfree(file_bytes);
                  return Status::AddressSpaceFailed;
              ''' : '''        memory::kfree(file_bytes);
                  release_context_storage(context_storage);
                  return Status::AddressSpaceFailed;
              ''',
              '''        log::write(log::Level::Error, "ELF", elf::status_message(load_status));
                  return Status::ElfLoadFailed;
              ''' : '''        log::write(log::Level::Error, "ELF", elf::status_message(load_status));
                  release_context_storage(context_storage);
                  return Status::ElfLoadFailed;
              ''',
              '''            static_cast<void>(cleanup(context));
                      return Status::StackMappingFailed;
              ''' : '''            static_cast<void>(cleanup(context));
                      release_context_storage(context_storage);
                      return Status::StackMappingFailed;
              ''',
              '''        static_cast<void>(cleanup(context));
                  return Status::TrampolineMappingFailed;
              ''' : '''        static_cast<void>(cleanup(context));
                  release_context_storage(context_storage);
                  return Status::TrampolineMappingFailed;
              ''',
              '''        __asm__ volatile("pushq %0; popfq" : : "r"(saved_flags) : "memory", "cc");
                  return Status::Busy;
              ''' : '''        __asm__ volatile("pushq %0; popfq" : : "r"(saved_flags) : "memory", "cc");
                  release_context_storage(context_storage);
                  return Status::Busy;
              ''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit('expected unique early-return anchor not found')
              text = text.replace(old, new, 1)

          activation_old = '''        __asm__ volatile("pushq %0; popfq" : : "r"(saved_flags) : "memory", "cc");
                  return Status::AddressSpaceActivationFailed;
              }
          '''
          if text.count(activation_old) != 2:
              raise SystemExit(f'expected two activation failure anchors, got {text.count(activation_old)}')
          activation_new = '''        __asm__ volatile("pushq %0; popfq" : : "r"(saved_flags) : "memory", "cc");
                  release_context_storage(context_storage);
                  return Status::AddressSpaceActivationFailed;
              }
          '''
          text = text.replace(activation_old, activation_new, 2)

          final_old = '''    const Status cleanup_status = cleanup(context);
              *result = context.result;
              return cleanup_status;
          }
          '''
          final_new = '''    const Status cleanup_status = cleanup(context);
              *result = context.result;
              release_context_storage(context_storage);
              return cleanup_status;
          }
          '''
          if text.count(final_old) != 1:
              raise SystemExit('runtime final cleanup anchor changed')
          text = text.replace(final_old, final_new, 1)

          if 'Context context{};' in text:
              raise SystemExit('stack-local runtime Context still present')
          path.write_text(text)

      - name: Inject Settings qualification probe
        shell: python
        run: |
          from pathlib import Path
          path = Path('userspace/system/init/main.c')
          text = path.read_text()
          anchor = '    (void)u_puts("[TEST] settings_service_spawn: PASS\\n");\n'
          replacement = anchor + (
              '    const ku_result_t settings_probe_pid = u_spawn("/system/setprobe");\n'
              '    if (settings_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] settings_service_roundtrip: FAIL\\n");\n'
              '        ku_exit(12);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('settings probe anchor changed')
          path.write_text(text.replace(anchor, replacement, 1))

      - name: Validate patch
        run: |
          git diff --check
          git diff -- kernel/user/runtime_base.inc
          ! grep -F 'Context context{};' kernel/user/runtime_base.inc

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils python3 qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build candidate media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: First boot writes typed Settings
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh build/images/KuroganeOS-linux.img --disk --persistent-disk --require-marker '[TEST] settings_service_persist_write: PASS' --timeout 180

      - name: Second boot reloads typed Settings
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh build/images/KuroganeOS-linux.img --disk --persistent-disk --require-marker '[TEST] settings_service_persist_reload: PASS' --timeout 180

      - name: Land production runtime fix
        run: |
          git checkout -- userspace/system/init/main.c
          git rm .github/workflows/runtime-context-pool-breakthrough.yml
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add kernel/user/runtime_base.inc
          git commit -m 'fix(runtime): move Ring-3 contexts off thread stacks'
          git push origin HEAD:gpt/road-to-15-consolidation
