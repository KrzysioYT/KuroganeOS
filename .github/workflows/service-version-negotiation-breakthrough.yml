name: Qualify service metadata and version negotiation

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/service-version-negotiation-breakthrough.yml'

permissions:
  contents: write

jobs:
  qualify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Implement service metadata and negotiation
        shell: python
        run: |
          from pathlib import Path

          service_h = r'''#ifndef KUROGANE_SDK_SERVICE_H
          #define KUROGANE_SDK_SERVICE_H

          #include <kurogane/ipc.h>

          /*
           * KuroganeOS 3.4 named-service contract.
           *
           * The kernel IPC endpoint table remains the single source of truth
           * for names, ownership, lifecycle and generation-safe handles. A
           * service registration adds bounded version/capability metadata to
           * that same endpoint; connect performs compatibility negotiation
           * before a channel is created.
           */
          #define KU_SERVICE_NAME_CAPACITY KU_IPC_SERVICE_NAME_CAPACITY
          #define KU_SERVICE_MESSAGE_CAPACITY KU_IPC_MESSAGE_CAPACITY
          #define KU_SERVICE_DESCRIPTOR_ABI_VERSION UINT32_C(1)
          #define KU_SERVICE_NEGOTIATION_ABI_VERSION UINT32_C(1)
          #define KU_SERVICE_DEFAULT_VERSION UINT32_C(1)

          typedef ku_ipc_handle_t ku_service_endpoint_t;
          typedef ku_ipc_handle_t ku_service_connection_t;
          typedef ku_ipc_message ku_service_message;

          typedef struct ku_service_descriptor {
              uint32_t structure_size;
              uint32_t abi_version;
              uint32_t service_version;
              uint32_t minimum_client_version;
              uint64_t capabilities;
              uint64_t reserved;
          } ku_service_descriptor;

          typedef struct ku_service_negotiation {
              uint32_t structure_size;
              uint32_t abi_version;
              uint32_t minimum_version;
              uint32_t maximum_version;
              uint32_t selected_version;
              uint32_t service_version;
              uint32_t minimum_client_version;
              uint32_t reserved;
              uint64_t capabilities;
              uint64_t owner_pid;
          } ku_service_negotiation;

          #if defined(__cplusplus)
          static_assert(sizeof(ku_service_descriptor) == 32, "service descriptor ABI mismatch");
          static_assert(sizeof(ku_service_negotiation) == 48, "service negotiation ABI mismatch");
          #else
          _Static_assert(sizeof(ku_service_descriptor) == 32, "service descriptor ABI mismatch");
          _Static_assert(sizeof(ku_service_negotiation) == 48, "service negotiation ABI mismatch");
          #endif

          static inline ku_result_t ku_service_register_versioned(
              const char* name,
              size_t name_size,
              const ku_service_descriptor* descriptor) {
              if (descriptor == NULL) return KU_STATUS_INVALID_ARGUMENT;
              return ku_syscall3(
                  KU_SYS_IPC_BIND,
                  (uint64_t)(uintptr_t)name,
                  (uint64_t)name_size,
                  (uint64_t)(uintptr_t)descriptor);
          }

          static inline ku_result_t ku_service_register(
              const char* name,
              size_t name_size) {
              const ku_service_descriptor descriptor = {
                  sizeof(ku_service_descriptor),
                  KU_SERVICE_DESCRIPTOR_ABI_VERSION,
                  KU_SERVICE_DEFAULT_VERSION,
                  KU_SERVICE_DEFAULT_VERSION,
                  UINT64_C(0),
                  UINT64_C(0)
              };
              return ku_service_register_versioned(name, name_size, &descriptor);
          }

          static inline ku_result_t ku_service_connect_versioned(
              const char* name,
              size_t name_size,
              ku_service_negotiation* negotiation) {
              if (negotiation == NULL) return KU_STATUS_INVALID_ARGUMENT;
              return ku_syscall3(
                  KU_SYS_IPC_CONNECT,
                  (uint64_t)(uintptr_t)name,
                  (uint64_t)name_size,
                  (uint64_t)(uintptr_t)negotiation);
          }

          static inline ku_result_t ku_service_connect(
              const char* name,
              size_t name_size) {
              ku_service_negotiation negotiation = {
                  sizeof(ku_service_negotiation),
                  KU_SERVICE_NEGOTIATION_ABI_VERSION,
                  KU_SERVICE_DEFAULT_VERSION,
                  KU_SERVICE_DEFAULT_VERSION,
                  0U, 0U, 0U, 0U, UINT64_C(0), UINT64_C(0)
              };
              return ku_service_connect_versioned(name, name_size, &negotiation);
          }

          static inline ku_result_t ku_service_accept(ku_service_endpoint_t endpoint) {
              return ku_ipc_accept(endpoint);
          }

          static inline ku_status_t ku_service_send(
              ku_service_connection_t connection,
              const void* data,
              size_t size) {
              return ku_ipc_send(connection, data, size);
          }

          static inline ku_status_t ku_service_receive(
              ku_service_connection_t connection,
              ku_service_message* message) {
              return ku_ipc_receive(connection, message);
          }

          static inline ku_status_t ku_service_close(ku_ipc_handle_t handle) {
              return ku_ipc_close(handle);
          }

          #endif
          '''
          # Remove workflow indentation from literal.
          service_h = '\n'.join(line[10:] if line.startswith('          ') else line for line in service_h.splitlines()) + '\n'
          Path('sdk/include/kurogane/service.h').write_text(service_h)

          channel_h = Path('kernel/ipc/channel.hpp')
          text = channel_h.read_text()
          text = text.replace(
              '''    WouldBlock,\n    PeerClosed,\n};''',
              '''    WouldBlock,\n    VersionMismatch,\n    PeerClosed,\n};''')
          marker = '''struct Message {\n    ProcessId sender_pid;\n    size_t size;\n    uint8_t bytes[MAX_MESSAGE_SIZE];\n};\n\n'''
          addition = '''struct ServiceMetadata {\n    uint32_t service_version;\n    uint32_t minimum_client_version;\n    uint64_t capabilities;\n};\n\nstruct ServiceNegotiation {\n    uint32_t minimum_version;\n    uint32_t maximum_version;\n    uint32_t selected_version;\n    uint32_t service_version;\n    uint32_t minimum_client_version;\n    uint64_t capabilities;\n    ProcessId owner_pid;\n};\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('channel.hpp message anchor changed')
          text = text.replace(marker, marker + addition, 1)
          text = text.replace(
              '''    size_t name_length,\n    Handle* endpoint);''',
              '''    size_t name_length,\n    Handle* endpoint,\n    const ServiceMetadata* metadata = nullptr);''', 1)
          text = text.replace(
              '''    size_t name_length,\n    Handle* channel);''',
              '''    size_t name_length,\n    Handle* channel,\n    ServiceNegotiation* negotiation = nullptr);''', 1)
          channel_h.write_text(text)

          channel_cpp = Path('kernel/ipc/channel.cpp')
          text = channel_cpp.read_text()
          endpoint_old = '''    uint8_t pending_count;\n    bool active;\n};'''
          endpoint_new = '''    uint8_t pending_count;\n    ServiceMetadata metadata;\n    bool versioned;\n    bool active;\n};'''
          if text.count(endpoint_old) != 1:
              raise SystemExit('endpoint slot anchor changed')
          text = text.replace(endpoint_old, endpoint_new, 1)

          bind_sig_old = '''Status bind(\n    ProcessId owner_pid,\n    const char* name,\n    size_t name_length,\n    Handle* endpoint) {'''
          bind_sig_new = '''Status bind(\n    ProcessId owner_pid,\n    const char* name,\n    size_t name_length,\n    Handle* endpoint,\n    const ServiceMetadata* metadata) {'''
          if text.count(bind_sig_old) != 1:
              raise SystemExit('bind signature anchor changed')
          text = text.replace(bind_sig_old, bind_sig_new, 1)

          bind_validate = '''    const Status name_status = validate_name(name, name_length);\n    if (name_status != Status::Ok) return name_status;\n'''
          bind_validate_new = bind_validate + '''    if (metadata != nullptr &&\n        (metadata->service_version == 0U ||\n         metadata->minimum_client_version == 0U ||\n         metadata->minimum_client_version > metadata->service_version)) {\n        return Status::InvalidArgument;\n    }\n'''
          if text.count(bind_validate) < 2:
              raise SystemExit('name validation anchors changed')
          text = text.replace(bind_validate, bind_validate_new, 1)

          bind_store = '''        slot.name[name_length] = '\\0';\n        slot.active = true;'''
          bind_store_new = '''        slot.name[name_length] = '\\0';\n        if (metadata != nullptr) {\n            slot.metadata = *metadata;\n            slot.versioned = true;\n        }\n        slot.active = true;'''
          if text.count(bind_store) != 1:
              raise SystemExit('bind metadata store anchor changed')
          text = text.replace(bind_store, bind_store_new, 1)

          connect_sig_old = '''Status connect(\n    ProcessId client_pid,\n    const char* name,\n    size_t name_length,\n    Handle* channel) {'''
          connect_sig_new = '''Status connect(\n    ProcessId client_pid,\n    const char* name,\n    size_t name_length,\n    Handle* channel,\n    ServiceNegotiation* negotiation) {'''
          if text.count(connect_sig_old) != 1:
              raise SystemExit('connect signature anchor changed')
          text = text.replace(connect_sig_old, connect_sig_new, 1)

          endpoint_found = '''    if (endpoint == nullptr) return Status::NotFound;\n    compact_pending(*endpoint);'''
          negotiate = '''    if (endpoint == nullptr) return Status::NotFound;\n    uint32_t selected_version = 0U;\n    if (negotiation != nullptr) {\n        if (negotiation->minimum_version == 0U ||\n            negotiation->maximum_version < negotiation->minimum_version) {\n            return Status::InvalidArgument;\n        }\n        if (!endpoint->versioned) return Status::VersionMismatch;\n        const uint32_t lower = negotiation->minimum_version >\n                endpoint->metadata.minimum_client_version\n            ? negotiation->minimum_version\n            : endpoint->metadata.minimum_client_version;\n        const uint32_t upper = negotiation->maximum_version <\n                endpoint->metadata.service_version\n            ? negotiation->maximum_version\n            : endpoint->metadata.service_version;\n        if (lower > upper) return Status::VersionMismatch;\n        selected_version = upper;\n    }\n    compact_pending(*endpoint);'''
          if text.count(endpoint_found) != 1:
              raise SystemExit('connect endpoint anchor changed')
          text = text.replace(endpoint_found, negotiate, 1)

          connect_success = '''        *channel = encode_channel(index, generation, false);\n        return Status::Ok;'''
          connect_success_new = '''        *channel = encode_channel(index, generation, false);\n        if (negotiation != nullptr) {\n            negotiation->selected_version = selected_version;\n            negotiation->service_version = endpoint->metadata.service_version;\n            negotiation->minimum_client_version =\n                endpoint->metadata.minimum_client_version;\n            negotiation->capabilities = endpoint->metadata.capabilities;\n            negotiation->owner_pid = endpoint->owner_pid;\n        }\n        return Status::Ok;'''
          if text.count(connect_success) != 1:
              raise SystemExit('connect success anchor changed')
          text = text.replace(connect_success, connect_success_new, 1)

          status_anchor = '''        case Status::WouldBlock: return "would block";'''
          if text.count(status_anchor) != 1:
              raise SystemExit('status message anchor changed')
          text = text.replace(
              status_anchor,
              status_anchor + '\n        case Status::VersionMismatch: return "service version mismatch";',
              1)
          channel_cpp.write_text(text)

          runtime = Path('kernel/user/runtime.cpp')
          text = runtime.read_text()
          include_anchor = '#include <kurogane/shared_memory.h>\n'
          if text.count(include_anchor) != 1:
              raise SystemExit('runtime include anchor changed')
          text = text.replace(include_anchor, include_anchor + '#include <kurogane/service.h>\n', 1)
          map_anchor = '''        case ipc::Status::WouldBlock: return KU_STATUS_WOULD_BLOCK;\n        case ipc::Status::NotInitialized:\n        case ipc::Status::PeerClosed: return KU_STATUS_BAD_STATE;'''
          map_new = '''        case ipc::Status::WouldBlock: return KU_STATUS_WOULD_BLOCK;\n        case ipc::Status::VersionMismatch: return KU_STATUS_VERSION_MISMATCH;\n        case ipc::Status::NotInitialized:\n        case ipc::Status::PeerClosed: return KU_STATUS_BAD_STATE;'''
          if text.count(map_anchor) != 1:
              raise SystemExit('ipc status mapping anchor changed')
          text = text.replace(map_anchor, map_new, 1)

          switch_old = '''        case KU_SYS_IPC_BIND:\n        case KU_SYS_IPC_CONNECT: {\n            if (frame.rdx != 0U) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            char name[ipc::MAX_SERVICE_NAME + 1U]{};\n            if (!copy_user_ipc_name(*context, frame.rdi, frame.rsi, name)) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n            ipc::Handle handle = ipc::INVALID_HANDLE;\n            const uint64_t interrupt_flags = save_and_disable_interrupts();\n            const ipc::Status status = frame.rax == KU_SYS_IPC_BIND\n                ? ipc::bind(\n                    context->pid, name, static_cast<size_t>(frame.rsi), &handle)\n                : ipc::connect(\n                    context->pid, name, static_cast<size_t>(frame.rsi), &handle);\n            restore_interrupts(interrupt_flags);\n            frame.rax = status == ipc::Status::Ok\n                ? handle : static_cast<uint64_t>(ipc_status(status));\n            return;\n        }'''
          switch_new = '''        case KU_SYS_IPC_BIND:\n        case KU_SYS_IPC_CONNECT: {\n            char name[ipc::MAX_SERVICE_NAME + 1U]{};\n            if (!copy_user_ipc_name(*context, frame.rdi, frame.rsi, name)) {\n                frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                return;\n            }\n\n            ipc::ServiceMetadata metadata{};\n            const ipc::ServiceMetadata* metadata_ptr = nullptr;\n            ipc::ServiceNegotiation negotiation{};\n            ipc::ServiceNegotiation* negotiation_ptr = nullptr;\n            ku_service_negotiation* user_negotiation = nullptr;\n\n            if (frame.rdx != 0U && frame.rax == KU_SYS_IPC_BIND) {\n                if (!validate_user_buffer(\n                        *context, frame.rdx, sizeof(ku_service_descriptor))) {\n                    frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                    return;\n                }\n                const auto* descriptor = reinterpret_cast<const ku_service_descriptor*>(\n                    static_cast<uintptr_t>(frame.rdx));\n                if (descriptor->structure_size != sizeof(*descriptor) ||\n                    descriptor->abi_version != KU_SERVICE_DESCRIPTOR_ABI_VERSION) {\n                    frame.rax = static_cast<uint64_t>(KU_STATUS_VERSION_MISMATCH);\n                    return;\n                }\n                if (descriptor->reserved != 0U || descriptor->service_version == 0U ||\n                    descriptor->minimum_client_version == 0U ||\n                    descriptor->minimum_client_version > descriptor->service_version) {\n                    frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                    return;\n                }\n                metadata.service_version = descriptor->service_version;\n                metadata.minimum_client_version = descriptor->minimum_client_version;\n                metadata.capabilities = descriptor->capabilities;\n                metadata_ptr = &metadata;\n            } else if (frame.rdx != 0U && frame.rax == KU_SYS_IPC_CONNECT) {\n                if (!validate_user_buffer(\n                        *context, frame.rdx, sizeof(ku_service_negotiation), true)) {\n                    frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                    return;\n                }\n                user_negotiation = reinterpret_cast<ku_service_negotiation*>(\n                    static_cast<uintptr_t>(frame.rdx));\n                if (user_negotiation->structure_size != sizeof(*user_negotiation) ||\n                    user_negotiation->abi_version != KU_SERVICE_NEGOTIATION_ABI_VERSION) {\n                    frame.rax = static_cast<uint64_t>(KU_STATUS_VERSION_MISMATCH);\n                    return;\n                }\n                if (user_negotiation->reserved != 0U ||\n                    user_negotiation->minimum_version == 0U ||\n                    user_negotiation->maximum_version < user_negotiation->minimum_version) {\n                    frame.rax = static_cast<uint64_t>(KU_STATUS_INVALID_ARGUMENT);\n                    return;\n                }\n                negotiation.minimum_version = user_negotiation->minimum_version;\n                negotiation.maximum_version = user_negotiation->maximum_version;\n                negotiation_ptr = &negotiation;\n            }\n\n            ipc::Handle handle = ipc::INVALID_HANDLE;\n            const uint64_t interrupt_flags = save_and_disable_interrupts();\n            const ipc::Status status = frame.rax == KU_SYS_IPC_BIND\n                ? ipc::bind(\n                    context->pid, name, static_cast<size_t>(frame.rsi), &handle,\n                    metadata_ptr)\n                : ipc::connect(\n                    context->pid, name, static_cast<size_t>(frame.rsi), &handle,\n                    negotiation_ptr);\n            restore_interrupts(interrupt_flags);\n            if (status == ipc::Status::Ok && user_negotiation != nullptr) {\n                user_negotiation->selected_version = negotiation.selected_version;\n                user_negotiation->service_version = negotiation.service_version;\n                user_negotiation->minimum_client_version =\n                    negotiation.minimum_client_version;\n                user_negotiation->capabilities = negotiation.capabilities;\n                user_negotiation->owner_pid = negotiation.owner_pid;\n            }\n            frame.rax = status == ipc::Status::Ok\n                ? handle : static_cast<uint64_t>(ipc_status(status));\n            return;\n        }'''
          if text.count(switch_old) != 1:
              raise SystemExit('runtime IPC bind/connect anchor changed')
          text = text.replace(switch_old, switch_new, 1)
          runtime.write_text(text)

          test = Path('tests/test_ipc.cpp')
          text = test.read_text()
          test_anchor = '''    Handle invalid = ipc::INVALID_HANDLE;\n    constexpr char bad_name[] = "bad/name";'''
          test_block = '''    // Named services add metadata to the existing endpoint registry and\n    // negotiate the highest mutually compatible version before allocating a\n    // channel. Raw IPC endpoints intentionally remain usable without it.\n    constexpr char versioned_service[] = "versioned.v3";\n    constexpr ipc::ProcessId versioned_server_pid = 500U;\n    constexpr ipc::ProcessId versioned_client_pid = 600U;\n    const ipc::ServiceMetadata service_metadata{3U, 1U, UINT64_C(0xA5)};\n    Handle versioned_endpoint = ipc::INVALID_HANDLE;\n    CHECK(ipc::bind(\n        versioned_server_pid, versioned_service, sizeof(versioned_service) - 1U,\n        &versioned_endpoint, &service_metadata) == Status::Ok);\n\n    ipc::ServiceNegotiation compatible{};\n    compatible.minimum_version = 1U;\n    compatible.maximum_version = 2U;\n    Handle versioned_client = ipc::INVALID_HANDLE;\n    CHECK(ipc::connect(\n        versioned_client_pid, versioned_service, sizeof(versioned_service) - 1U,\n        &versioned_client, &compatible) == Status::Ok);\n    CHECK(compatible.selected_version == 2U);\n    CHECK(compatible.service_version == 3U);\n    CHECK(compatible.minimum_client_version == 1U);\n    CHECK(compatible.capabilities == UINT64_C(0xA5));\n    CHECK(compatible.owner_pid == versioned_server_pid);\n\n    Handle versioned_server = ipc::INVALID_HANDLE;\n    CHECK(ipc::accept(\n        versioned_server_pid, versioned_endpoint, &versioned_server) == Status::Ok);\n    CHECK(ipc::close(versioned_server_pid, versioned_server) == Status::Ok);\n    CHECK(ipc::close(versioned_client_pid, versioned_client) == Status::Ok);\n\n    ipc::ServiceNegotiation incompatible{};\n    incompatible.minimum_version = 4U;\n    incompatible.maximum_version = 5U;\n    Handle rejected_client = ipc::INVALID_HANDLE;\n    CHECK(ipc::connect(\n        versioned_client_pid, versioned_service, sizeof(versioned_service) - 1U,\n        &rejected_client, &incompatible) == Status::VersionMismatch);\n    CHECK(rejected_client == ipc::INVALID_HANDLE);\n    CHECK(ipc::close(versioned_server_pid, versioned_endpoint) == Status::Ok);\n\n    constexpr char legacy_service[] = "legacy.raw";\n    Handle legacy_endpoint = ipc::INVALID_HANDLE;\n    CHECK(ipc::bind(\n        versioned_server_pid, legacy_service, sizeof(legacy_service) - 1U,\n        &legacy_endpoint) == Status::Ok);\n    compatible = {};\n    compatible.minimum_version = 1U;\n    compatible.maximum_version = 1U;\n    CHECK(ipc::connect(\n        versioned_client_pid, legacy_service, sizeof(legacy_service) - 1U,\n        &rejected_client, &compatible) == Status::VersionMismatch);\n    CHECK(ipc::close(versioned_server_pid, legacy_endpoint) == Status::Ok);\n\n    Handle invalid = ipc::INVALID_HANDLE;\n    constexpr char bad_name[] = "bad/name";'''
          if text.count(test_anchor) != 1:
              raise SystemExit('IPC host test anchor changed')
          text = text.replace(test_anchor, test_block, 1)
          test.write_text(text)

      - name: Inject real Ring-3 service roundtrip
        shell: python
        run: |
          from pathlib import Path
          path = Path('userspace/system/init/main.c')
          text = path.read_text()
          anchor = '    (void)u_puts("[TEST] event_broker_spawn: PASS\\n");\n'
          replacement = anchor + (
              '    const ku_result_t event_probe_pid = u_spawn("/system/evprobe");\n'
              '    if (event_probe_pid <= 0) {\n'
              '        (void)u_puts("[TEST] event_broker_roundtrip: FAIL\\n");\n'
              '        ku_exit(8);\n'
              '    }\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('event probe anchor changed')
          path.write_text(text.replace(anchor, replacement, 1))

      - name: Validate source edits
        run: |
          git diff --check
          grep -F 'KU_SERVICE_NEGOTIATION_ABI_VERSION' sdk/include/kurogane/service.h
          grep -F 'VersionMismatch' kernel/ipc/channel.cpp
          grep -F 'ServiceNegotiation' tests/test_ipc.cpp

      - name: Run host regression
        run: bash ./scripts/run-host-tests.sh

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools gdisk xorriso

      - name: Build full release media
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s build/images/KuroganeOS-linux.img

      - name: Require versioned Ring-3 service roundtrip
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            build/images/KuroganeOS-linux.img \
            --disk \
            --require-marker '[TEST] event_broker_roundtrip: PASS' \
            --timeout 180

      - name: Land qualified service core
        run: |
          git checkout -- userspace/system/init/main.c
          git rm .github/workflows/service-version-negotiation-breakthrough.yml
          git config user.name 'KuroganeOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add sdk/include/kurogane/service.h kernel/ipc/channel.hpp kernel/ipc/channel.cpp kernel/user/runtime.cpp tests/test_ipc.cpp
          git commit -m 'service: add metadata and version negotiation'
          git push origin HEAD:gpt/road-to-15-consolidation
