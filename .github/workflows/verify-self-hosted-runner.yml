name: Verify Kurogane Self-Hosted Runner

on:
  push:
    branches:
      - gpt/road-to-15-consolidation
    paths:
      - '.github/workflows/verify-self-hosted-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runner:
    runs-on: [self-hosted, kurogane, kvm]
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: Verify host and KVM
        shell: bash
        run: |
          set -euo pipefail
          echo "[runner] hostname=$(hostname)"
          echo "[runner] kernel=$(uname -srmo)"
          echo "[runner] user=$(id)"
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          qemu-system-x86_64 --version | head -n 1
          command -v gcc
          command -v g++
          command -v ld
          command -v objcopy
          command -v make
          command -v python3
          command -v mcopy
          command -v mkfs.fat
          command -v sgdisk
          command -v xorriso
          find /usr/share/OVMF /usr/share/ovmf -maxdepth 2 -type f \( -iname 'OVMF_CODE*.fd' -o -iname 'OVMF_VARS*.fd' \) -print 2>/dev/null | tee /tmp/kurogane-ovmf-files.txt
          test -s /tmp/kurogane-ovmf-files.txt
          timeout 3s qemu-system-x86_64 \
            -accel kvm \
            -machine q35 \
            -cpu host \
            -m 128M \
            -nodefaults \
            -display none \
            -S || test "$?" -eq 124
          echo '[TEST] self_hosted_runner: PASS'
          echo '[TEST] self_hosted_kvm: PASS'
