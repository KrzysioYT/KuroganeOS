name: KuroganeOS UEFI ISO qualification

on:
  push:
    branches: [ main ]
    paths:
      - 'boot/**'
      - 'common/**'
      - 'kernel/**'
      - 'rootfs/**'
      - 'sdk/**'
      - 'userspace/**'
      - 'scripts/**'
      - 'tests/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'Makefile'
      - 'linker.ld'
      - '.github/workflows/virtualbox-iso.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'boot/**'
      - 'common/**'
      - 'kernel/**'
      - 'rootfs/**'
      - 'sdk/**'
      - 'userspace/**'
      - 'scripts/**'
      - 'tests/**'
      - 'third_party/**'
      - '.gitmodules'
      - 'Makefile'
      - 'linker.ld'
      - '.github/workflows/virtualbox-iso.yml'
  workflow_dispatch:

jobs:
  iso-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and UEFI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils python3 \
            qemu-system-x86 ovmf \
            mtools dosfstools gdisk xorriso

      - name: Resolve KuroganeOS version
        run: |
          version="$(sed -n 's/^#define KUROGANE_VERSION_STRING "\([^"]*\)"/\1/p' common/version.h)"
          test -n "$version"
          echo "KUROGANE_VERSION=$version" >> "$GITHUB_ENV"
          echo "KUROGANE_ISO=dist/KuroganeOS-$version-x86_64.iso" >> "$GITHUB_ENV"
          echo "KUROGANE_IMG=dist/KuroganeOS-$version-linux-qemu.img" >> "$GITHUB_ENV"
          echo "KUROGANE_LIVE_IMG=build/images/KuroganeOS-linux.img" >> "$GITHUB_ENV"

      - name: Parse PowerShell qualification scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            'scripts/smoke-virtualbox-iso.ps1',
            'scripts/smoke-virtualbox-try.ps1',
            'scripts/qualify-virtualbox-3.3.4.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              Write-Error "PowerShell parse errors in $file"
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell qualification script syntax validation failed.' }

      - name: Compile kernel test configuration
        run: |
          make CONFIG=test kernel

      - name: Run host ABI and SDK regression tests
        run: |
          chmod +x scripts/run-host-tests.sh
          make test

      - name: Run full host regression suite
        run: |
          chmod +x scripts/test.sh
          bash ./scripts/test.sh

      - name: Build Linux IMG and ISO
        run: |
          chmod +x scripts/*.sh
          bash ./scripts/build-media-linux.sh --configuration release --rebuild
          test -s "$KUROGANE_LIVE_IMG"

      - name: Validate Foundation image through production FAT32/VFS
        run: |
          mkdir -p build/tests
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            tests/test_root_volume_image.cpp \
            tests/host_system_metrics_stub.cpp \
            tests/host_process_path_stub.cpp \
            kernel/fs/root_volume.cpp \
            kernel/fs/fat32.cpp \
            kernel/fs/fat32_vfs.cpp \
            kernel/fs/vfs.cpp \
            kernel/install/package.cpp \
            kernel/install/package_vfs.cpp \
            kernel/libk/crc.cpp \
            kernel/storage/gpt.cpp \
            kernel/storage/partition_device.cpp \
            -o build/tests/fat32_vfs_host_validation
          build/tests/fat32_vfs_host_validation "$KUROGANE_IMG"

      - name: Verify ISO structure 20 times
        run: |
          bash ./scripts/verify-virtualbox-iso.sh \
            "$KUROGANE_ISO" \
            --passes 20

      - name: Boot ISO through OVMF
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            "$KUROGANE_ISO" \
            --timeout 60

      - name: Qualify QEMU E1000 NAT networking
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            "$KUROGANE_LIVE_IMG" \
            --disk \
            --nic e1000 \
            --require-network \
            --timeout 120

      - name: Qualify QEMU PCnet NAT networking
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            "$KUROGANE_LIVE_IMG" \
            --disk \
            --nic pcnet \
            --require-network \
            --timeout 120

      - name: Qualify QEMU VirtIO-net NAT networking
        run: |
          bash ./scripts/smoke-uefi-iso-qemu.sh \
            "$KUROGANE_LIVE_IMG" \
            --disk \
            --nic virtio \
            --require-network \
            --timeout 120

      - name: Publish qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuroganeos-${{ env.KUROGANE_VERSION }}-uefi-media
          if-no-files-found: error
          path: |
            ${{ env.KUROGANE_ISO }}
            ${{ env.KUROGANE_IMG }}
            dist/SHA256SUMS.txt
