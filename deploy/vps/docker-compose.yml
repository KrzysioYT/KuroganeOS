services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PORTAL_HOST: ${PORTAL_HOST:-kuroganeos.dev}
      WWW_HOST: ${WWW_HOST:-www.kuroganeos.dev}
      DOCS_HOST: ${DOCS_HOST:-docs.kuroganeos.dev}
      PACKAGES_HOST: ${PACKAGES_HOST:-repo.kuroganeos.dev}
      DOWNLOADS_HOST: ${DOWNLOADS_HOST:-downloads.kuroganeos.dev}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ../..:/srv/repository:ro
      - ../../docs:/srv/source-docs:ro
      - packages:/srv/packages:ro
      - ${DOWNLOADS_DIR:-/opt/kuroganeos/downloads}:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - package-sync

  package-sync:
    image: alpine/git:2.47.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/sync-packages"]
    environment:
      PACKAGE_REPOSITORY: ${PACKAGE_REPOSITORY:-https://github.com/KrzysioYT/KuroganeOS-Packages.git}
      PACKAGE_BRANCH: ${PACKAGE_BRANCH:-main}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ./scripts/sync-packages.sh:/usr/local/bin/sync-packages:ro
      - packages:/srv/packages

volumes:
  packages:
  caddy_data:
  caddy_config:
